<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>OMEGAS V8.2 NEXT</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./components/map-k-editor.css">
  <link rel="stylesheet" href="./components/predictor.css">
  <link rel="stylesheet" href="./components/curve.css">
  <link rel="stylesheet" href="./components/obd.css">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <header class="global-bar" aria-label="Estado do veículo">
      <div class="brand-block"><strong>OMEGAS</strong><span class="version">V8.2 NEXT</span></div>
      <div class="global-status" id="global-status">
        <span class="status-dot" data-status="offline" id="ecu-dot" aria-hidden="true"></span>
        <span id="ecu-status">ECU offline</span><span class="separator" aria-hidden="true">•</span>
        <strong id="fuel-status">—</strong><span class="freshness" id="freshness-status">sem telemetria</span>
      </div>
      <button class="icon-action" id="settings-button" type="button" aria-label="Mais e configurações">⋯</button>
    </header>
    <main class="workspace" id="workspace" aria-live="polite"></main>
    <nav class="main-nav" id="main-nav" aria-label="Navegação principal"></nav>
    <section class="context-sheet" id="context-sheet" hidden aria-modal="true" role="dialog"></section>
  </div>
  <script type="module" src="./bootstrap.js"></script>
</body>
</html>
