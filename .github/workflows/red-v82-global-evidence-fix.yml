name: OMEGAS focused global evidence fix

on:
  push:
    branches:
      - work/red-v82-global-evidence-fix
  pull_request:
    branches:
      - work/red-v82-science-blend

permissions:
  contents: read

concurrency:
  group: omegas-focused-global-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Prove exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Learning grid regression
        run: node --test tests/ui/learning-view.test.cjs
      - name: Operational UI contract
        run: node --test tests/ui/red-v82-operational-ux.test.cjs
      - name: Learning understanding contract
        run: node tests/ui/learning-understanding.test.cjs
      - name: UX didactic contract
        run: python tests/test_ux_didactic_expansion_contract.py
      - name: Global evidence regression
        run: chmod +x gradlew && ./gradlew testDebugUnitTest --tests com.omegas.prohub.learning.AssistedCalibrationAdvisorTest
