name: OMEGAS focused global evidence fix

on:
  push:
    branches:
      - work/red-v82-global-evidence-fix
    paths:
      - "app/src/main/java/com/omegas/prohub/learning/AssistedCalibrationAdvisor.kt"
      - "app/src/main/java/com/omegas/prohub/HubJavascriptBridge.kt"
      - "app/src/main/java/com/omegas/prohub/service/TelemetryForegroundService.kt"
      - "app/src/main/assets/ui/index.html"
      - "app/src/main/assets/ui/core/native-api.js"
      - "app/src/main/assets/ui/core/learning-model.js"
      - "app/src/main/assets/ui/screens/curve.js"
      - "app/src/main/assets/ui/screens/learning.js"
      - "app/src/main/assets/ui/styles.css"
      - "app/src/main/assets/ui/styles-refine.css"
      - "app/src/test/java/com/omegas/prohub/learning/AssistedCalibrationAdvisorTest.kt"
      - "tests/ui/learning-view.test.cjs"
      - "tests/ui/learning-understanding.test.cjs"
      - "tests/ui/red-v82-operational-ux.test.cjs"
      - "tests/test_ux_didactic_expansion_contract.py"
      - ".github/workflows/red-v82-global-evidence-fix.yml"

permissions:
  contents: read

concurrency:
  group: omegas-focused-global-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Prove exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Learning grid regression
        run: node --test tests/ui/learning-view.test.cjs
      - name: Operational UI contract
        run: node --test tests/ui/red-v82-operational-ux.test.cjs
      - name: Learning understanding contract
        run: node tests/ui/learning-understanding.test.cjs
      - name: UX didactic contract
        run: python tests/test_ux_didactic_expansion_contract.py
      - name: Global evidence regression
        run: chmod +x gradlew && ./gradlew testDebugUnitTest --tests com.omegas.prohub.learning.AssistedCalibrationAdvisorTest
