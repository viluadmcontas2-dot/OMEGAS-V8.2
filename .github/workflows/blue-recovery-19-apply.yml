name: Blue recovery 19 apply

on:
  push:
    branches:
      - work/omegas-blue-causal-engine
    paths:
      - tools/recovery_apply_19.py
      - .github/workflows/blue-recovery-19-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: work/omegas-blue-causal-engine
          fetch-depth: 0

      - name: Apply recovery patch
        run: python3 -B tools/recovery_apply_19.py

      - name: Verify FAST contracts before commit
        run: python3 -B tools/run_checks.py

      - name: Commit production recovery and remove applicator
        run: |
          set -euo pipefail
          rm -f tools/recovery_apply_19.py .github/workflows/blue-recovery-19-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(blue): recover Learning semantics and serial policy #19"
          git push origin HEAD:work/omegas-blue-causal-engine
