name: Phase 06 foundation verification

on:
  push:
    branches:
      - rebuild/v8.2-final-implementation
    paths:
      - ci/phase6-foundation-verify.txt

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Physics foundation JVM tests
        id: physics
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest --tests 'com.omegas.prohub.physics.*'
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.physics.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then state=success; else state=failure; fi
          payload=$(jq -nc --arg state "$state" --arg context "omegas/phase6-foundation" --arg description "Phase 06 foundation JVM: $OUTCOME" '{state:$state,context:$context,description:$description}')
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
          [ "$state" = "success" ]
