name: OMEGAS RED V8.2 Exhaust Existing Tests

on:
  workflow_dispatch:
  push:
    branches:
      - work/red-v82-science-blend
    paths:
      - "app/**"
      - "lab/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/red-v82-exhaust-existing-tests.yml"

permissions:
  contents: read

concurrency:
  group: omegas-red-v82-exhaust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exhaust-existing-tests:
    name: EXHAUST all existing repository tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v7

      - name: Prove source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$GITHUB_SHA"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties

      - name: Inventory every existing executable test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          find tests -type f -name 'test_*.py' -print | sort > build/evidence/root-python-tests.txt
          find lab -type f -name 'test_*.py' -print | sort > build/evidence/lab-python-tests.txt
          find tests -type f \( -name '*.test.cjs' -o -name '*.test.js' -o -name '*.test.mjs' -o -name '*.spec.cjs' -o -name '*.spec.js' -o -name '*.spec.mjs' \) -print | sort > build/evidence/node-tests.txt
          find app/src/test -type f \( -name '*.kt' -o -name '*.java' \) -print | sort > build/evidence/android-jvm-tests.txt
          {
            echo "ROOT_PYTHON_TESTS=$(wc -l < build/evidence/root-python-tests.txt)"
            echo "LAB_PYTHON_TESTS=$(wc -l < build/evidence/lab-python-tests.txt)"
            echo "NODE_TESTS=$(wc -l < build/evidence/node-tests.txt)"
            echo "ANDROID_JVM_TEST_FILES=$(wc -l < build/evidence/android-jvm-tests.txt)"
          } | tee build/evidence/exhaust-counts.txt
          cat build/evidence/root-python-tests.txt
          cat build/evidence/lab-python-tests.txt
          cat build/evidence/node-tests.txt
          cat build/evidence/android-jvm-tests.txt

      - name: Execute every root Python test file directly
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          : > build/evidence/root-python-direct-results.txt
          while IFS= read -r test_file; do
            test -n "$test_file" || continue
            echo "===== DIRECT PYTHON: $test_file ====="
            if python3 -B "$test_file"; then
              echo "PASS $test_file" | tee -a build/evidence/root-python-direct-results.txt
            else
              echo "FAIL $test_file" | tee -a build/evidence/root-python-direct-results.txt
              failures=$((failures + 1))
            fi
          done < build/evidence/root-python-tests.txt
          echo "$failures" > build/evidence/root-python-direct-failures.txt
          echo "ROOT_PYTHON_DIRECT_FAILURES=$failures"
          exit 0

      - name: Discover every root Python unittest
        shell: bash
        run: |
          set -uo pipefail
          python3 -B -m unittest discover -v -s tests -p 'test_*.py' 2>&1 | tee build/evidence/root-python-discovery.log
          status=${PIPESTATUS[0]}
          echo "$status" > build/evidence/root-python-discovery-status.txt
          echo "ROOT_PYTHON_DISCOVERY_STATUS=$status"
          exit 0

      - name: Execute every lab Python test as repository module
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          : > build/evidence/lab-python-module-results.txt
          while IFS= read -r test_file; do
            test -n "$test_file" || continue
            module="${test_file%.py}"
            module="${module//\//.}"
            echo "===== LAB MODULE: $module ====="
            if python3 -B -m unittest -v "$module"; then
              echo "PASS $module" | tee -a build/evidence/lab-python-module-results.txt
            else
              echo "FAIL $module" | tee -a build/evidence/lab-python-module-results.txt
              failures=$((failures + 1))
            fi
          done < build/evidence/lab-python-tests.txt
          echo "$failures" > build/evidence/lab-python-module-failures.txt
          echo "LAB_PYTHON_MODULE_FAILURES=$failures"
          exit 0

      - name: Discover every lab Python unittest
        shell: bash
        run: |
          set -uo pipefail
          python3 -B -m unittest discover -v -s lab/red_blend -p 'test_*.py' 2>&1 | tee build/evidence/lab-python-discovery.log
          status=${PIPESTATUS[0]}
          echo "$status" > build/evidence/lab-python-discovery-status.txt
          echo "LAB_PYTHON_DISCOVERY_STATUS=$status"
          exit 0

      - name: Execute every Node test file
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          : > build/evidence/node-direct-results.txt
          while IFS= read -r test_file; do
            test -n "$test_file" || continue
            echo "===== NODE TEST: $test_file ====="
            if node --test "$test_file"; then
              echo "PASS $test_file" | tee -a build/evidence/node-direct-results.txt
            else
              echo "FAIL $test_file" | tee -a build/evidence/node-direct-results.txt
              failures=$((failures + 1))
            fi
          done < build/evidence/node-tests.txt
          echo "$failures" > build/evidence/node-direct-failures.txt
          echo "NODE_DIRECT_FAILURES=$failures"
          exit 0

      - name: Execute every Android JVM unit test
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest -PomegasAbis=armeabi-v7a --no-daemon --stacktrace 2>&1 | tee build/evidence/android-jvm.log
          status=${PIPESTATUS[0]}
          echo "$status" > build/evidence/android-jvm-status.txt
          echo "ANDROID_JVM_STATUS=$status"
          exit 0

      - name: Exhaustion receipt and final gate
        shell: bash
        run: |
          set -euo pipefail
          root_direct="$(cat build/evidence/root-python-direct-failures.txt)"
          root_discovery="$(cat build/evidence/root-python-discovery-status.txt)"
          lab_module="$(cat build/evidence/lab-python-module-failures.txt)"
          lab_discovery="$(cat build/evidence/lab-python-discovery-status.txt)"
          node_direct="$(cat build/evidence/node-direct-failures.txt)"
          android_jvm="$(cat build/evidence/android-jvm-status.txt)"
          if [ "$root_direct" -eq 0 ] && [ "$root_discovery" -eq 0 ] && [ "$lab_module" -eq 0 ] && [ "$lab_discovery" -eq 0 ] && [ "$node_direct" -eq 0 ] && [ "$android_jvm" -eq 0 ]; then
            overall=PASS
          else
            overall=FAIL
          fi
          {
            echo "OMEGAS_EXISTING_TEST_EXHAUSTION=$overall"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"
            cat build/evidence/exhaust-counts.txt
            echo "ROOT_PYTHON_DIRECT_FAILURES=$root_direct"
            echo "ROOT_PYTHON_DISCOVERY_STATUS=$root_discovery"
            echo "LAB_PYTHON_MODULE_FAILURES=$lab_module"
            echo "LAB_PYTHON_DISCOVERY_STATUS=$lab_discovery"
            echo "NODE_DIRECT_FAILURES=$node_direct"
            echo "ANDROID_JVM_STATUS=$android_jvm"
            echo "NEW_SCIENCE_TESTS_CREATED=false"
            echo "ECU_AUTO_WRITE=false"
            echo "VEHICLE_PROVEN=false"
          } | tee build/evidence/exhaust-existing-tests-receipt.txt
          test "$overall" = PASS

      - name: Upload exhaustive inventory and receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: omegas-red-v82-existing-test-exhaustion-${{ github.sha }}
          path: |
            build/evidence/root-python-tests.txt
            build/evidence/lab-python-tests.txt
            build/evidence/node-tests.txt
            build/evidence/android-jvm-tests.txt
            build/evidence/exhaust-counts.txt
            build/evidence/root-python-direct-results.txt
            build/evidence/root-python-direct-failures.txt
            build/evidence/root-python-discovery.log
            build/evidence/root-python-discovery-status.txt
            build/evidence/lab-python-module-results.txt
            build/evidence/lab-python-module-failures.txt
            build/evidence/lab-python-discovery.log
            build/evidence/lab-python-discovery-status.txt
            build/evidence/node-direct-results.txt
            build/evidence/node-direct-failures.txt
            build/evidence/android-jvm.log
            build/evidence/android-jvm-status.txt
            build/evidence/exhaust-existing-tests-receipt.txt
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
