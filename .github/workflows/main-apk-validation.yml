name: OMEGAS Main APK Validation

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - docs/ci/main-apk-validation-trigger.md

permissions:
  contents: read

concurrency:
  group: omegas-main-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
  OMEGAS_SOURCE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}

jobs:
  fast-gate:
    name: Gate rapido e contratos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Registrar fonte validada
        run: echo "OMEGAS_SOURCE_SHA=$OMEGAS_SOURCE_SHA"
      - name: Baixar fonte exata da main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OMEGAS_SOURCE_SHA }}
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Executar quality gate rapido
        run: python -B tools/run_checks.py
      - name: Verificar sintaxe e diff
        run: |
          set -euo pipefail
          for script in app/src/main/assets/ui/*.js; do node --check "$script"; done
          git diff --check

  android:
    name: Testar, lintar e gerar APK da main
    needs: fast-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Registrar fonte validada
        run: echo "OMEGAS_SOURCE_SHA=$OMEGAS_SOURCE_SHA"
      - name: Baixar fonte exata da main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OMEGAS_SOURCE_SHA }}
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Preparar Gradle
        run: chmod +x gradlew
      - name: Testar nucleo, lint e compilar
        run: |
          set -euo pipefail
          mkdir -p build/reports
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug \
            --no-daemon --stacktrace --console=plain 2>&1 | tee build/reports/gradle-build.log
      - name: Organizar APK e calcular SHA-256
        run: |
          set -euo pipefail
          mkdir -p build/delivery
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" "build/delivery/OMEGAS-V7-MAIN-${OMEGAS_SOURCE_SHA:0:7}.apk"
          sha256sum build/delivery/*.apk | tee build/delivery/SHA256SUMS.txt
      - name: Publicar APK e relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OMEGAS-V7-MAIN-${{ env.OMEGAS_SOURCE_SHA }}
          path: |
            build/delivery/**
            build/reports/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7
