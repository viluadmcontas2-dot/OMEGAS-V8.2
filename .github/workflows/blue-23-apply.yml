name: "Blue #23 apply"

on:
  workflow_dispatch:
  push:
    branches:
      - work/omegas-blue-causal-engine
    paths:
      - ".github/workflows/blue-23-apply.yml"

permissions:
  contents: write

concurrency:
  group: blue-23-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v7
        with:
          ref: work/omegas-blue-causal-engine
          fetch-depth: 0

      - name: Reconstruct and verify exact payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/blue23_payload/chunk00a.txt \
            .github/blue23_payload/chunk00b.txt \
            .github/blue23_payload/chunk01a.txt \
            .github/blue23_payload/chunk01b.txt \
            .github/blue23_payload/chunk02.txt \
            .github/blue23_payload/chunk03.txt \
            .github/blue23_payload/chunk04a.txt \
            .github/blue23_payload/chunk04b.txt \
            .github/blue23_payload/chunk05.txt \
            | base64 -d > /tmp/blue23.tar.gz
          echo "d7933f64a6b2f4c6b37e6e0178cb47ffbeea9c3a3c94e9f2fb8c8aca81af273d  /tmp/blue23.tar.gz" | sha256sum -c -
          tar -xzf /tmp/blue23.tar.gz -C .
          test ! -e local.properties
          python3 - <<'PY'
          from pathlib import Path
          import tarfile

          with tarfile.open('/tmp/blue23.tar.gz', 'r:gz') as archive:
              files = [member.name for member in archive.getmembers() if member.isfile()]
          if len(files) != 28:
              raise SystemExit(f'expected 28 payload files, found {len(files)}')
          for name in files:
              p = Path(name)
              raw = p.read_bytes()
              if b'\x00' in raw:
                  raise SystemExit(f'non-text payload file: {name}')
              p.write_bytes(raw.replace(b'\r\n', b'\n').replace(b'\r', b'\n'))

          p = Path('app/src/test/java/com/omegas/prohub/blue/BlueTemporalPairingTest.kt')
          p.write_text(p.read_text(encoding='utf-8').rstrip('\n') + '\n', encoding='utf-8')
          PY

      - name: Focused Python and UI contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/test_blue_apk_owner_gate_contract.py
          python3 -B tests/test_blue_obd_gnv_only_integration_contract.py
          node --test tests/ui/blue-multimedia-witness-dashboard.test.cjs tests/ui/obd-runtime-controls.test.cjs
          node --check app/src/main/assets/ui/screens/obd.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Focused JVM science contracts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest \
            --tests '*Obd*' \
            --tests '*BlueWitness*' \
            --tests '*BlueTemporalPairingTest*' \
            --tests '*BlueMapKAddressingTest*' \
            -PomegasAbis=armeabi-v7a \
            --no-daemon --stacktrace

      - name: Stage issue 23 files
        shell: bash
        run: |
          set -euo pipefail
          test ! -e local.properties
          git add -- \
            AGENTS.md \
            .specify/memory/constitution.md \
            app/src/main/assets/ui/screens/obd.js \
            app/src/main/java/com/omegas/prohub/blue/BlueCausalEngine.kt \
            app/src/main/java/com/omegas/prohub/blue/BlueMapKAddressing.kt \
            app/src/main/java/com/omegas/prohub/blue/BlueWitnessConfidence.kt \
            app/src/main/java/com/omegas/prohub/calibration/BlueCalibrationCoordinator.kt \
            app/src/main/java/com/omegas/prohub/obd/ObdWitnessEngine.kt \
            app/src/test/java/com/omegas/prohub/blue/BlueMapKAddressingTest.kt \
            app/src/test/java/com/omegas/prohub/blue/BlueTemporalPairingTest.kt \
            app/src/test/java/com/omegas/prohub/blue/BlueWitnessConfidenceTest.kt \
            app/src/test/java/com/omegas/prohub/blue/BlueWitnessGnvOnlyTest.kt \
            app/src/test/java/com/omegas/prohub/blue/BlueWitnessProjectionTest.kt \
            app/src/test/java/com/omegas/prohub/obd/ObdWitnessEngineTest.kt \
            app/src/test/java/com/omegas/prohub/obd/ObdWitnessGnvOnlyTest.kt \
            docs/OBD_COMPLETE_RUNTIME_SCOPE.md \
            docs/OBD_INDEPENDENT_EVIDENCE.md \
            docs/superpowers/plans/2026-09-05-blue-obd-witness.md \
            docs/superpowers/plans/2026-09-06-blue-finalization.md \
            docs/superpowers/specs/2026-09-05-blue-obd-witness-design.md \
            docs/superpowers/specs/2026-09-06-blue-finalization-design.md \
            specs/001-blue-runtime-convergence/plan.md \
            specs/001-blue-runtime-convergence/spec.md \
            specs/001-blue-runtime-convergence/tasks.md \
            tests/test_blue_apk_owner_gate_contract.py \
            tests/test_blue_obd_gnv_only_integration_contract.py \
            tests/ui/blue-multimedia-witness-dashboard.test.cjs \
            tests/ui/obd-runtime-controls.test.cjs
          git diff --cached --name-status
          test -n "$(git diff --cached --name-only)"

      - name: Check forbidden staged paths
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --name-only | grep -E '(^|/)local\.properties$|\.apk$|(^|/)build/|^\.github/blue23_payload/|^\.github/workflows/blue-23-apply\.yml$'; then
            echo "Forbidden transport/artifact staged"
            exit 1
          fi

      - name: Check staged whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check

      - name: Commit issue 23 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(blue): align MP48 equivalence and GNV STFT witness #23"

      - name: Push issue 23 files
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:work/omegas-blue-causal-engine
