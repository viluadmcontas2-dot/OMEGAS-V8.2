name: Blue OBD fuel gate apply

on:
  push:
    branches:
      - work/omegas-blue-causal-engine

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: arm OBD fuel gate applicator' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: work/omegas-blue-causal-engine
          fetch-depth: 0
      - name: Apply OBD fuel gate production change
        run: |
          set -euo pipefail
          python3 -B tools/one_shot_obd_fuel_gate.py
          python3 -B tests/test_blue_obd_witness_runtime_pairing_contract.py
      - name: Commit production change
        run: |
          set -euo pipefail
          git config user.name 'omegas-blue-bot'
          git config user.email 'omegas-blue-bot@users.noreply.github.com'
          git add app/src/main/java/com/omegas/prohub/service/TelemetryForegroundService.kt
          git diff --cached --check
          git commit -m 'feat(obd): gate physical evidence by MP48 fuel state'
          git push origin HEAD:work/omegas-blue-causal-engine
