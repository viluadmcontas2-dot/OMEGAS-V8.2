name: CodSpeed Benchmarks

on:
  push:
    branches: [ OMEGAS-SPEED ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # SPEED-only integration: no unrelated PR or main branch CI work.
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC authentication with CodSpeed

concurrency:
  # Keep base and head available for comparisons even when pushes overlap.
  group: codspeed-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        run: python3 -m pip install --disable-pip-version-check -r benchmarks/requirements.txt

      - name: Verify offline Portmon payload parity
        run: python3 -B tests/test_portmon_payload_lazy.py

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pytest benchmarks --codspeed
