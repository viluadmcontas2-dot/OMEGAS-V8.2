name: OMEGAS RED V8.2 Science Blend

on:
  workflow_dispatch:
  push:
    branches:
      - work/red-v82-science-blend
    paths:
      - "app/**"
      - "config/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "package.json"
      - "package-lock.json"
      - "lab/red_blend/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/red-v82-science-blend.yml"

permissions:
  contents: read

concurrency:
  group: omegas-red-v82-blend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  science-local:
    name: SCIENCE LOCAL falsification
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact Blend SHA
        uses: actions/checkout@v7

      - name: Prove source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$GITHUB_SHA"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"

      - name: RED fast contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/run_checks.py

      - name: Blend synthetic local science tests
        run: python3 -B -m unittest -v lab.red_blend.test_local_science

      - name: Reconstruct governed WU-006 episode fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/science/reconstruct_fixture.py tests/fixtures/science/episodes tests/fixtures/science/episodes/index.json build/science/omegas_corpus_20260828_episodes.jsonl.gz

      - name: Blend real-corpus local science tests
        run: python3 -B -m unittest -v lab.red_blend.test_real_corpus

      - name: Real-corpus gasoline audit
        run: python3 -B -m lab.red_blend.real_corpus tests/fixtures/science/episodes tests/fixtures/science/episodes/index.json --fuel GASOLINA --min-samples 4 --bootstrap-draws 600 --seed 20260830 --top 12

      - name: Real-corpus CNG audit
        run: python3 -B -m lab.red_blend.real_corpus tests/fixtures/science/episodes tests/fixtures/science/episodes/index.json --fuel GNV --min-samples 4 --bootstrap-draws 600 --seed 20260830 --top 12

      - name: Blend synthetic session-independence tests
        run: python3 -B -m unittest -v lab.red_blend.test_session_science

      - name: Blend real-corpus session-independence tests
        run: python3 -B -m unittest -v lab.red_blend.test_real_session_science

      - name: Real-corpus gasoline session audit
        run: python3 -B -m lab.red_blend.session_science tests/fixtures/science/episodes tests/fixtures/science/episodes/index.json --fuel GASOLINA --min-samples 4 --min-independent-sessions 3 --top 20

      - name: Real-corpus CNG session audit
        run: python3 -B -m lab.red_blend.session_science tests/fixtures/science/episodes tests/fixtures/science/episodes/index.json --fuel GNV --min-samples 4 --min-independent-sessions 3 --top 20

      - name: Blend blind walk-forward tests
        run: python3 -B -m unittest -v lab.red_blend.test_walk_forward

      - name: Real-corpus blind walk-forward audit
        run: python3 -B -m lab.red_blend.walk_forward tests/fixtures/science/episodes tests/fixtures/science/episodes/index.json

      - name: Blend risk-gated hybrid tests
        run: python3 -B -m unittest -v lab.red_blend.test_hybrid_science

      - name: Real-corpus nested hybrid audit
        run: python3 -B -m lab.red_blend.hybrid_science tests/fixtures/science/episodes tests/fixtures/science/episodes/index.json

      - name: Existing mechanistic calibration tests
        run: python3 -B -m unittest -v lab.red_blend.test_mechanistic_calibration

      - name: Existing geometric field tests
        run: python3 -B -m unittest -v lab.red_blend.test_geometric_field

      - name: Blend causal MAP_K contract tests
        run: python3 -B -m unittest -v lab.red_blend.test_causal_map_k

      - name: Blend causal science fixture and effect tests
        run: python3 -B -m unittest -v lab.red_blend.test_causal_science

      - name: Blend real causal support audit tests
        run: python3 -B -m unittest -v lab.red_blend.test_real_causal_science

      - name: Blend causal Predictor promotion gate tests
        run: >-
          python3 -B -m unittest -v
          lab.red_blend.test_calibration_chronology
          lab.red_blend.test_calibration_ablation
          lab.red_blend.test_autocal_regime_ablation

      - name: Blend sensitivity fail-closed tests
        run: python3 -B -m unittest -v lab.red_blend.test_sensitivity_science

      - name: Blend empirical risk coverage tests
        run: python3 -B -m unittest -v lab.red_blend.test_risk_coverage

      - name: Blend P(improve) fail-closed tests
        run: python3 -B -m unittest -v lab.red_blend.test_p_improve_science

      - name: Blend OOD transfer falsification tests
        run: python3 -B -m unittest -v lab.red_blend.test_ood_falsification

      - name: Blend RED baseline delta gate tests
        run: python3 -B -m unittest -v lab.red_blend.test_performance_gate

  cache-contracts:
    name: AUXILIARY science cache contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout exact Blend SHA
        uses: actions/checkout@v7

      - name: Run portable cache contracts
        run: python3 -B -m unittest -v lab.red_blend.test_science_warehouse

  performance-ab:
    name: PERFORMANCE RED baseline guard + offline A/B
    needs: science-local
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RED_BASELINE_SHA: b637f5fff19b1ece93f22d1fced9640618609a60
    steps:
      - name: Checkout exact Blend SHA with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prove RED baseline and exact reviewed deltas
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$RED_BASELINE_SHA^{commit}"
          mkdir -p build/evidence
          git diff --name-only "$RED_BASELINE_SHA" "$GITHUB_SHA" | sort > build/evidence/red-blend-changed-paths.txt
          python3 -B - <<'PY'
          from dataclasses import asdict
          import json
          import os
          from pathlib import Path
          import subprocess
          from lab.red_blend.performance_gate import classify_runtime_delta

          path = Path("build/evidence/red-blend-changed-paths.txt")
          changed = [line for line in path.read_text(encoding="utf-8").splitlines() if line]
          current_blobs = {}
          for changed_path in changed:
              try:
                  current_blobs[changed_path] = subprocess.check_output(
                      ["git", "rev-parse", f"HEAD:{changed_path}"], text=True
                  ).strip()
              except subprocess.CalledProcessError:
                  current_blobs[changed_path] = "MISSING"
          result = classify_runtime_delta(changed, current_blobs=current_blobs)
          payload = asdict(result)
          payload["baseline_sha"] = os.environ["RED_BASELINE_SHA"]
          payload["blend_sha"] = os.environ["GITHUB_SHA"]
          payload["changed_path_count"] = len(changed)
          Path("build/evidence/red-blend-runtime-identity.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          if not result.baseline_preserved:
              raise SystemExit("Blend contains an unreviewed runtime/build delta or no longer preserves the RED baseline")
          PY

      - name: Offline replay latency and memory observation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          import statistics
          import time
          import tracemalloc

          from lab.red_blend.ood_falsification import assess_transfer_ood
          from lab.red_blend.real_corpus import load_governed_fixture
          from lab.red_blend.walk_forward import predict_wu006_neighbor_baseline

          parts = Path("tests/fixtures/science/episodes")
          episodes = load_governed_fixture(parts, parts / "index.json")
          gas = sorted(
              (e for e in episodes if e["fuel"] == "GASOLINA"),
              key=lambda e: (e["order"], e["start_ms"], e["session_key"]),
          )
          targets = [e for e in gas if any(t["order"] < e["order"] for t in gas)]

          def timed(fn, repetitions=8):
              samples = []
              supported = 0
              calls = 0
              for _ in range(repetitions):
                  start = time.perf_counter_ns()
                  local_supported = 0
                  for target in targets:
                      value = fn(gas, target)
                      calls += 1
                      if value is not None:
                          local_supported += 1
                  elapsed = time.perf_counter_ns() - start
                  supported = local_supported
                  samples.append(elapsed / max(len(targets), 1))
              return {
                  "calls": calls,
                  "target_count": len(targets),
                  "supported_last_pass": supported,
                  "ns_per_target_median": statistics.median(samples),
                  "ns_per_target_min": min(samples),
                  "ns_per_target_max": max(samples),
              }

          baseline = timed(predict_wu006_neighbor_baseline)
          ood = timed(
              lambda training, target: (
                  decision.prediction
                  if (decision := assess_transfer_ood(training, target)).transfer_supported
                  else None
              )
          )

          def peak_bytes(fn):
              tracemalloc.start()
              for target in targets:
                  fn(gas, target)
              _, peak = tracemalloc.get_traced_memory()
              tracemalloc.stop()
              return peak

          payload = {
              "claim_scope": "OFFLINE_REPLAY_PERFORMANCE_INFORMATIONAL_NOT_ANDROID_HOT_PATH",
              "threshold_gate": None,
              "red_neighbor_baseline": baseline,
              "blend_ood_wrapper": ood,
              "red_neighbor_peak_tracemalloc_bytes": peak_bytes(predict_wu006_neighbor_baseline),
              "blend_ood_peak_tracemalloc_bytes": peak_bytes(
                  lambda training, target: assess_transfer_ood(training, target)
              ),
          }
          Path("build/evidence/red-blend-offline-performance.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload G13 performance evidence
        uses: actions/upload-artifact@v6
        with:
          name: omegas-red-blend-performance-${{ github.sha }}
          path: |
            build/evidence/red-blend-changed-paths.txt
            build/evidence/red-blend-runtime-identity.json
            build/evidence/red-blend-offline-performance.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  android-full:
    name: ANDROID full + APK candidate
    needs:
      - science-local
      - performance-ab
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RED_BASELINE_SHA: b637f5fff19b1ece93f22d1fced9640618609a60
    steps:
      - name: Checkout exact Blend SHA with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prove source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$RED_BASELINE_SHA^{commit}"
          echo "SOURCE_SHA=$GITHUB_SHA"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Set up JDK 17 with Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties

      - name: Full JVM + lint + APK
        shell: bash
        env:
          OMEGAS_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug \
            -PomegasAbis=armeabi-v7a \
            --no-daemon --stacktrace

      - name: Prove APK and write G14/G15 receipt
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/debug -type f -name '*.apk' | sort | head -n 1)"
          test -n "$APK_PATH"
          test -s "$APK_PATH"
          mkdir -p build/evidence
          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          APK_BYTES="$(stat -c%s "$APK_PATH")"
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          if git diff --quiet "$RED_BASELINE_SHA" "$GITHUB_SHA" -- app/; then
            ANDROID_RUNTIME_SOURCE_DELTA_FROM_RED=false
          else
            ANDROID_RUNTIME_SOURCE_DELTA_FROM_RED=true
          fi
          {
            echo "OMEGAS_RED_V82_BLEND_ANDROID_CI=PASS"
            echo "G14_FULL_ANDROID=PASS"
            echo "G15_APK_CANDIDATE=PASS"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "SOURCE_TREE=$SOURCE_TREE"
            echo "APK_PATH=$APK_PATH"
            echo "APK_SHA256=$APK_SHA256"
            echo "APK_BYTES=$APK_BYTES"
            echo "ANDROID_RUNTIME_SOURCE_DELTA_FROM_RED=$ANDROID_RUNTIME_SOURCE_DELTA_FROM_RED"
            echo "RED_BASELINE_FALLBACK_PRESERVED=true"
            echo "EXACT_REVIEWED_RUNTIME_DELTAS_PINNED=true"
            echo "DEVICE_PERFORMANCE_CLAIMED=false"
            echo "FULL_ANDROID_VALIDATION_REQUIRED_AND_PASSED=true"
            echo "P_IMPROVE_CALIBRATED=false"
            echo "CAUSAL_MAP_K_REAL=ABSTAIN_UNPROVEN_COMMON_TIMEBASE"
            echo "ECU_AUTO_WRITE=false"
            echo "SIMULATED_ECU_ONLY=true"
            echo "NO_INSTALL_PERFORMED=true"
            echo "VEHICLE_PROVEN=false"
          } | tee build/evidence/omegas-red-v82-blend-android-ci.txt

      - name: Upload G14/G15 APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: omegas-red-v82-blend-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            build/evidence/omegas-red-v82-blend-android-ci.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
