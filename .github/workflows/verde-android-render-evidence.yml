name: OmegasVerde Android render evidence

on:
  workflow_dispatch:
  push:
    branches: [OmegasVerde]
    paths:
      - '.github/workflows/verde-android-render-evidence.yml'
      - 'app/build.gradle.kts'
      - 'app/src/androidTest/**'
      - 'app/src/main/assets/ui/**'
      - 'app/src/main/java/com/omegas/prohub/MainActivity.kt'
      - 'app/src/main/java/com/omegas/prohub/web/**'
      - 'app/src/main/java/com/omegas/prohub/telemetry/**'
      - 'app/src/main/java/com/omegas/prohub/ecu/Mp48Protocol.kt'
      - 'tests/fixtures/portmon-autocal-cycle-v1.json'

permissions:
  contents: read

concurrency:
  group: omegas-verde-android-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          test -e /dev/kvm || { echo "/dev/kvm unavailable"; exit 2; }

      - name: Run real Android WebView evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          script: |
            set -u
            chmod +x gradlew
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace || exit 2
            adb shell wm size 1280x720
            adb shell wm density 160
            adb install -r app/build/outputs/apk/debug/app-debug.apk || exit 2
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk || exit 2
            adb shell pm grant com.omegas.v7.test android.permission.POST_NOTIFICATIONS || true
            adb shell dumpsys deviceidle whitelist +com.omegas.v7.test || true

            mkdir -p rendered-evidence
            overall=0

            for entry in "dashboard-fresh:dashboardFreshLevelsRaw" "dashboard-invalid:dashboardInvalidLevelsPlaceholder" "autocal-fresh-control:autocalFreshLevelsControl"
            do
              scenario="${entry%%:*}"
              method="${entry##*:}"
              adb shell am instrument -w -r -e class "com.omegas.prohub.DashboardLevelsRenderTest#${method}" com.omegas.v7.test.test/androidx.test.runner.AndroidJUnitRunner > "rendered-evidence/${scenario}-instrumentation.txt" 2>&1
              rc=$?
              cat "rendered-evidence/${scenario}-instrumentation.txt"
              adb pull /sdcard/Android/data/com.omegas.v7.test/files/omegas-evidence/. rendered-evidence/ || true
              adb exec-out screencap -p > "rendered-evidence/${scenario}-post.png" || true
              if [ "$rc" -ne 0 ]; then overall=1; fi
            done

            exit "$overall"

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-render-evidence
          path: rendered-evidence
          retention-days: 7
          if-no-files-found: warn
