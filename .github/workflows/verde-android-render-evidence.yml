name: OmegasVerde Android render evidence

on:
  workflow_dispatch:
  push:
    branches: [OmegasVerde]
    paths:
      - '.github/workflows/verde-android-render-evidence.yml'
      - 'app/build.gradle.kts'
      - 'app/src/androidTest/**'
      - 'app/src/main/assets/ui/**'
      - 'app/src/main/java/com/omegas/prohub/MainActivity.kt'
      - 'app/src/main/java/com/omegas/prohub/web/**'
      - 'app/src/main/java/com/omegas/prohub/telemetry/**'
      - 'app/src/main/java/com/omegas/prohub/ecu/Mp48Protocol.kt'
      - 'tests/fixtures/portmon-autocal-cycle-v1.json'

permissions:
  contents: read

concurrency:
  group: omegas-verde-android-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Boot preinstalled Android 35 emulator
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/avdmanager' | sort -V | tail -n 1)"
          IMAGE="$SDK_ROOT/system-images/android-35/google_apis/x86_64"

          test -x "$ADB"
          test -x "$EMULATOR"
          test -x "$AVDMANAGER"
          test -d "$IMAGE" || { echo "preinstalled Android 35 image missing: $IMAGE"; exit 2; }

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm || true

          "$ADB" start-server
          echo no | "$AVDMANAGER" create avd --force -n omegas-ci -k "system-images;android-35;google_apis;x86_64"
          nohup "$EMULATOR" -avd omegas-ci -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics > emulator.log 2>&1 &

          "$ADB" wait-for-device
          for i in $(seq 1 180); do
            state="$("$ADB" get-state 2>/dev/null || true)"
            boot="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$state" = "device" ] && [ "$boot" = "1" ]; then break; fi
            sleep 2
          done
          test "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = "1" || {
            tail -300 emulator.log || true
            "$ADB" devices -l || true
            exit 2
          }

          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          "$ADB" shell wm size 1280x720
          "$ADB" shell wm density 160
          "$ADB" shell wm size
          "$ADB" shell wm density

      - name: Build instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Install APKs
        shell: bash
        run: |
          set -euo pipefail
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm grant com.omegas.v7.test android.permission.POST_NOTIFICATIONS || true
          adb shell dumpsys deviceidle whitelist +com.omegas.v7.test || true

      - name: Run three real WebView scenarios
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p rendered-evidence
          overall=0
          for entry in \
            "dashboard-fresh:dashboardFreshLevelsRaw" \
            "dashboard-invalid:dashboardInvalidLevelsPlaceholder" \
            "autocal-fresh-control:autocalFreshLevelsControl"
          do
            scenario="${entry%%:*}"
            method="${entry##*:}"
            set +e
            adb shell am instrument -w -r \
              -e class "com.omegas.prohub.DashboardLevelsRenderTest#${method}" \
              com.omegas.v7.test.test/androidx.test.runner.AndroidJUnitRunner \
              | tee "rendered-evidence/${scenario}-instrumentation.txt"
            rc=${PIPESTATUS[0]}
            set -e
            adb pull /sdcard/Android/data/com.omegas.v7.test/files/omegas-evidence/. rendered-evidence/ || true
            adb exec-out screencap -p > "rendered-evidence/${scenario}-post.png" || true
            if [ "$rc" -ne 0 ]; then overall=1; fi
          done
          exit "$overall"

      - name: Collect emulator diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p rendered-evidence
          cp emulator.log rendered-evidence/ 2>/dev/null || true
          adb logcat -d -t 1200 > rendered-evidence/logcat-tail.txt 2>/dev/null || true
          adb shell dumpsys window windows > rendered-evidence/window-dump.txt 2>/dev/null || true

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-render-evidence
          path: rendered-evidence
          retention-days: 7
          if-no-files-found: error
