name: Dinamometro Omegas LAB APK
on:
  push:
    branches: ['lab/dinamometro-omegas-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Verificar interface
        run: node --test dyno/tests/ui.test.cjs
      - name: Compilar APK experimental e testes nativos
        run: |
          chmod +x gradlew
          ./gradlew :dyno:testDebugUnitTest :dyno:assembleDebug --no-daemon --stacktrace
      - name: Integridade de APK
        run: |
          test -s dyno/build/outputs/apk/debug/dyno-debug.apk
          sha256sum dyno/build/outputs/apk/debug/dyno-debug.apk
          unzip -t dyno/build/outputs/apk/debug/dyno-debug.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dinamometro-omegas-lab-apk
          path: dyno/build/outputs/apk/debug/dyno-debug.apk
          retention-days: 30
