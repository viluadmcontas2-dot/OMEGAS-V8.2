# One-shot RED build. Ordinary source commits do not retrigger this workflow.
name: Build OMEGAS V8.0 RED APK

on:
  workflow_dispatch:
  push:
    branches:
      - hotfix/v8.0-red-performance
    paths:
      - .github/workflows/build-red-apk.yml

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact RED commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify source identity
        run: |
          echo "RED_BUILD_COMMIT=$(git rev-parse HEAD)"
          echo "RED_BASE=work/v8.2-clean@9cd9a6ac9960b26a752a316667a325b1fe184c75"
          git status --short
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

      - name: Full Python contract suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: JVM unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Assemble RED debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Generate RED SHA-256 receipt
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK" | tee OMEGAS-V8.0-RED-APK-SHA256.txt
          printf 'PROJECT_ID=OMEGAS_V8_0_RED\n' | tee OMEGAS-V8.0-RED-BUILD-RECEIPT.txt
          printf 'BUILD_COMMIT=%s\n' "$(git rev-parse HEAD)" | tee -a OMEGAS-V8.0-RED-BUILD-RECEIPT.txt
          printf 'BASE_COMMIT=9cd9a6ac9960b26a752a316667a325b1fe184c75\n' | tee -a OMEGAS-V8.0-RED-BUILD-RECEIPT.txt
          printf 'APK=%s\n' "$APK" | tee -a OMEGAS-V8.0-RED-BUILD-RECEIPT.txt
          cat OMEGAS-V8.0-RED-APK-SHA256.txt | tee -a OMEGAS-V8.0-RED-BUILD-RECEIPT.txt

      - name: Upload RED APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMEGAS-V8.0-RED-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            OMEGAS-V8.0-RED-APK-SHA256.txt
            OMEGAS-V8.0-RED-BUILD-RECEIPT.txt
          if-no-files-found: error
          retention-days: 7
