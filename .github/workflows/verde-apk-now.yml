name: OMEGAS VERDE RAW APK HANDOFF

on:
  push:
    branches:
      - OmegasVerde
    paths:
      - .github/workflows/verde-apk-now.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PRODUCT_SHA: febb8482a64e53ca2cafe8a7bd232ad4d38d3693
  ARTIFACT_ID: "10810564529"
  EXPECTED_APK_SHA256: 18240c81c2f4e3f516ee1b267ec630ff4024cd55ffa7ec4202584b3e4849f432
  RELEASE_TAG: omegas-verde-febb8482-drive-handoff
  APK_NAME: OMEGAS-Verde-FINAL-febb8482.apk

jobs:
  publish-raw-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact verified GitHub artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          APK="$(find artifact -type f -name 'app-debug.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" "$APK_NAME"
          ACTUAL_SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_APK_SHA256"
          echo "RAW_APK_SHA256=$ACTUAL_SHA"
          echo "RAW_APK_BYTES=$(stat -c %s "$APK_NAME")"

      - name: Publish raw APK as GitHub release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$PRODUCT_SHA" \
              --title "OMEGAS Verde final febb8482" \
              --notes "Raw APK handoff for Google Drive. Product source: $PRODUCT_SHA. APK SHA-256: $EXPECTED_APK_SHA256."
          fi
          gh release upload "$RELEASE_TAG" "$APK_NAME#$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[] | select(.name == env.APK_NAME) | {name,size,browser_download_url}'
