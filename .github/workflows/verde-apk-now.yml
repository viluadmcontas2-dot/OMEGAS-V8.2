name: OMEGAS VERDE APK NOW

on:
  push:
    branches: [ OmegasVerde ]
    paths:
      - '.github/workflows/verde-apk-now.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  PRODUCT_SHA: febb8482a64e53ca2cafe8a7bd232ad4d38d3693

concurrency:
  group: omegas-verde-apk-final-febb8482
  cancel-in-progress: true

jobs:
  verify-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}

      - name: Prove checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          echo "SOURCE_SHA=$(git rev-parse HEAD)"

      - name: Publish remote run locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          OMEGAS_APK_RUN_LOCATOR
          run_id=${{ github.run_id }}
          run_attempt=${{ github.run_attempt }}
          trigger_sha=${{ github.sha }}
          product_sha=${PRODUCT_SHA}
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/101/comments" -f body="$BODY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run contracts, unit tests, lint and assemble
        shell: bash
        env:
          OMEGAS_SOURCE_SHA: ${{ env.PRODUCT_SHA }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          python3 -B tools/run_checks.py
          ./gradlew clean testDebugUnitTest lintDebug assembleDebug             -PomegasAbis=armeabi-v7a             --no-daemon             --stacktrace

      - name: Verify and hash APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p build/evidence
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          APK_BYTES="$(stat -c %s "$APK")"
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          unzip -t "$APK" >/dev/null

          BUILD_CONFIG="$(find app/build/generated -type f -name 'BuildConfig.java' -path '*debug*' -print -quit || true)"
          BUILD_COMMIT=""
          if [ -n "$BUILD_CONFIG" ] && [ -f "$BUILD_CONFIG" ]; then
            BUILD_COMMIT="$(sed -n 's/.*OMEGAS_BUILD_COMMIT = "\([^"]*\)".*/\1/p' "$BUILD_CONFIG" | head -n1)"
          fi

          {
            echo "OMEGAS_VERDE_APK=PASS"
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "SOURCE_TREE=$SOURCE_TREE"
            echo "OMEGAS_BUILD_COMMIT=$BUILD_COMMIT"
            echo "EXPECTED_BUILD_COMMIT=${PRODUCT_SHA:0:12}"
            echo "APK_PATH=$APK"
            echo "APK_SHA256=$APK_SHA256"
            echo "APK_BYTES=$APK_BYTES"
            echo "APK_ZIP_INTEGRITY=PASS"
            echo "PHYSICAL_INSTALL_NOT_YET_CLAIMED=true"
          } | tee build/evidence/omegas-verde-apk-evidence.txt

          test "$SOURCE_SHA" = "$PRODUCT_SHA"
          if [ -n "$BUILD_COMMIT" ]; then
            test "$BUILD_COMMIT" = "${PRODUCT_SHA:0:12}"
          fi
          echo "sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "bytes=$APK_BYTES" >> "$GITHUB_OUTPUT"

      - name: Publish APK + evidence
        uses: actions/upload-artifact@v4
        with:
          name: omegas-verde-final-${{ env.PRODUCT_SHA }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/evidence/omegas-verde-apk-evidence.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish remote receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          APK_BYTES: ${{ steps.apk.outputs.bytes }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          OMEGAS_APK_REMOTE_RECEIPT
          run_id=${{ github.run_id }}
          run_attempt=${{ github.run_attempt }}
          trigger_sha=${{ github.sha }}
          product_sha=${PRODUCT_SHA}
          job_status=${{ job.status }}
          artifact=omegas-verde-final-${PRODUCT_SHA}
          apk_sha256=${APK_SHA256:-unavailable}
          apk_bytes=${APK_BYTES:-unavailable}
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/101/comments" -f body="$BODY"
