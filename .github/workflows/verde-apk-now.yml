# Platina APK readiness gate. This workflow never builds on push.
name: OMEGAS PLATINA APK READY GATED

on:
  workflow_call:
    inputs:
      build_apk:
        required: false
        default: false
        type: boolean
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Gerar APK somente após autorização explícita do proprietário'
        required: true
        default: false
        type: boolean
permissions:
  contents: read

env:
  PRODUCT_SHA: ${{ inputs.source_sha || github.sha }}

concurrency:
  group: omegas-platina-apk-gated-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify-build-publish:
    if: ${{ inputs.build_apk == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}

      - name: Prove checkout identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          echo "SOURCE_SHA=$(git rev-parse HEAD)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Contracts and isolated JVM performance checks
        shell: bash
        env:
          OMEGAS_SOURCE_SHA: ${{ env.PRODUCT_SHA }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          python3 -B tools/run_checks.py
          ./gradlew clean testDebugUnitTest \
            -PomegasAbis=armeabi-v7a \
            --no-parallel --max-workers=1 \
            --no-daemon \
            --stacktrace

      - name: Lint and assemble after JVM performance checks
        shell: bash
        env:
          OMEGAS_SOURCE_SHA: ${{ env.PRODUCT_SHA }}
        run: |
          set -euo pipefail
          ./gradlew lintDebug assembleDebug \
            -PomegasAbis=armeabi-v7a \
            --no-daemon \
            --stacktrace

      - name: Preserve JVM and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-jvm-performance-${{ env.PRODUCT_SHA }}
          path: |
            app/build/perf
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

      - name: Medição de desempenho do Refino (corpus real)
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/perf/equivalence-view.txt
          cat app/build/perf/equivalence-view.txt

      # Testes Node que leem o resultado do JVM (precisam rodar DEPOIS do testDebugUnitTest).
      # Gate de verdade: falhou aqui, o APK não é publicado (provado verde no run do SHA fbfc857).
      - name: Testes Node que dependem do resultado do JVM
        id: gradle_ui
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for t in $(grep -l '@requires-gradle-test-results' tests/ui/*.test.cjs); do
            echo "+ node --test $t"
            node --test "$t" || status=$?
          done
          echo "GRADLE_DEPENDENT_UI_TESTS_EXIT=$status"
          exit $status

      - name: Refino behavioral mutation probes
        if: ${{ hashFiles('tools/ci/run_refinement_mutants.py') != '' }}
        env:
          OMEGAS_SOURCE_SHA: ${{ env.PRODUCT_SHA }}
        shell: bash
        run: python3 tools/ci/run_refinement_mutants.py

      - name: Verify and hash APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p build/evidence
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          APK_BYTES="$(stat -c %s "$APK")"
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          unzip -t "$APK" >/dev/null

          BUILD_CONFIG="$(find app/build/generated -type f -name 'BuildConfig.java' -path '*debug*' -print -quit || true)"
          BUILD_COMMIT=""
          if [ -n "$BUILD_CONFIG" ] && [ -f "$BUILD_CONFIG" ]; then
            BUILD_COMMIT="$(sed -n 's/.*OMEGAS_BUILD_COMMIT = "\([^"]*\)".*/\1/p' "$BUILD_CONFIG" | head -n1)"
          fi

          {
            echo "OMEGAS_PLATINA_APK=PASS"
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "SOURCE_TREE=$SOURCE_TREE"
            echo "OMEGAS_BUILD_COMMIT=$BUILD_COMMIT"
            echo "EXPECTED_BUILD_COMMIT=${PRODUCT_SHA:0:12}"
            echo "APK_PATH=$APK"
            echo "APK_SHA256=$APK_SHA256"
            echo "APK_BYTES=$APK_BYTES"
            echo "APK_ZIP_INTEGRITY=PASS"
            echo "PHYSICAL_INSTALL_NOT_YET_CLAIMED=true"
          } | tee build/evidence/omegas-platina-apk-evidence.txt

          test "$SOURCE_SHA" = "$PRODUCT_SHA"
          if [ -n "$BUILD_COMMIT" ]; then
            test "$BUILD_COMMIT" = "${PRODUCT_SHA:0:12}"
          fi

      - name: Publish APK + evidence
        uses: actions/upload-artifact@v4
        with:
          name: omegas-platina-final-${{ env.PRODUCT_SHA }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/evidence/omegas-platina-apk-evidence.txt
            build/evidence/refinement-mutants.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0