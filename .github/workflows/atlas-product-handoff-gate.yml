name: OMEGAS Atlas Product Handoff Gate

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/atlas-product-handoff-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1029e1837e39785f882ee3fcf7b04435371b400a
      - name: Run Atlas product handoff contract
        run: |
          python3 -m unittest \
            atlas.tests.test_product_handoff_gate \
            atlas.tests.test_consumer_compatibility \
            tests.test_transversal_governance_contract
