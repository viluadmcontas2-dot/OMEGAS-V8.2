name: OMEGAS Atlas Product Handoff Gate

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/atlas-product-handoff-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ce50ab102430d5f27407079fd4e544e70788a988
      - name: Run Atlas product handoff contract
        run: python3 -m unittest atlas.tests.test_product_handoff_gate
