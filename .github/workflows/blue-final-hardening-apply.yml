name: Blue final hardening apply

on:
  push:
    branches:
      - work/omegas-blue-causal-engine
    paths:
      - tools/blue_final_hardening_apply.py
      - .github/workflows/blue-final-hardening-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: work/omegas-blue-causal-engine
          fetch-depth: 1
      - name: Apply deterministic hardening
        run: python3 -B tools/blue_final_hardening_apply.py
      - name: Commit production cut
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(blue): harden multimedia and cut OBD legacy"
          git push origin HEAD:work/omegas-blue-causal-engine
