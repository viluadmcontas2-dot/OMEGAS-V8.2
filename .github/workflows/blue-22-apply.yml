name: "Blue #22 apply"

on:
  push:
    branches:
      - work/omegas-blue-causal-engine
    paths:
      - ".github/workflows/blue-22-apply.yml"

permissions:
  contents: write

concurrency:
  group: blue-22-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v7
        with:
          ref: work/omegas-blue-causal-engine
          fetch-depth: 0

      - name: Apply issue 22 curve interaction recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          curve = Path('app/src/main/assets/ui/screens/curve.js')
          s = curve.read_text(encoding='utf-8')
          replacements = [
              ("""      this.selectedIndices = new Set();\n      this.dragSelecting = false;""", """      this.selectedIndices = new Set();\n      this.selectionMode = false;\n      this.dragSelecting = false;"""),
              ("""      document.getElementById('curvePreparePoint')?.addEventListener('click', () => this.prepareSelectionTarget());\n      document.getElementById('curveClearSelection')?.addEventListener('click', () => this.clearSelection());""", """      document.getElementById('curvePreparePoint')?.addEventListener('click', () => this.prepareSelectionTarget());\n      document.getElementById('curveSelectionMode')?.addEventListener('click', () => this.setSelectionMode(!this.selectionMode));\n      document.getElementById('curveClearSelection')?.addEventListener('click', () => this.clearSelection());\n      this.updateSelectionUi();"""),
              ("""      this.proposals.clear();\n      this.selectedIndices.clear();\n      this.activeIndex = null;""", """      this.proposals.clear();\n      this.selectedIndices.clear();\n      this.selectionMode = false;\n      this.activeIndex = null;\n      this.updateSelectionUi();"""),
              ("""    selectedPointIndices() {\n      if (this.selectedIndices.size) return [...this.selectedIndices].sort((a, b) => a - b);\n      return this.activeIndex === null ? [] : [this.activeIndex];\n    }\n\n    refreshActiveEditor() {""", """    selectedPointIndices() {\n      if (this.selectedIndices.size) return [...this.selectedIndices].sort((a, b) => a - b);\n      return this.activeIndex === null ? [] : [this.activeIndex];\n    }\n\n    updateSelectionUi() {\n      const count = this.selectedIndices.size;\n      const mode = document.getElementById('curveSelectionMode');\n      const countNode = document.getElementById('curveSelectionCount');\n      if (mode) {\n        mode.setAttribute('aria-pressed', String(this.selectionMode));\n        mode.textContent = this.selectionMode ? 'Seleção ON' : 'Ativar seleção';\n      }\n      if (countNode) countNode.textContent = `${this.selectionMode ? 'Seleção ON' : 'Seleção OFF'} · ${count} selecionado${count === 1 ? '' : 's'}`;\n    }\n\n    setSelectionMode(enabled) {\n      this.selectionMode = enabled === true;\n      this.dragSelecting = false;\n      this.dragMoved = false;\n      this.dragStartIndex = null;\n      this.dragStartWasSelected = false;\n      if (!this.selectionMode && this.selectedIndices.size > 1) {\n        const keep = this.activeIndex !== null && this.selectedIndices.has(this.activeIndex)\n          ? this.activeIndex\n          : [...this.selectedIndices].at(-1);\n        this.selectedIndices.clear();\n        if (keep !== undefined && keep !== null) this.selectedIndices.add(Number(keep));\n      }\n      this.updateSelectionUi();\n      this.renderChart();\n      return this.selectionMode;\n    }\n\n    refreshActiveEditor() {"""),
              ("""      this.activeIndex = Number(point.index);\n      this.refreshActiveEditor();\n      this.renderChart();""", """      this.activeIndex = Number(point.index);\n      this.refreshActiveEditor();\n      this.updateSelectionUi();\n      this.renderChart();"""),
              ("""    toggleSelection(index) {\n      const point = this.pointByIndex(index);\n      if (!point) return;\n      const key = Number(point.index);""", """    toggleSelection(index) {\n      const point = this.pointByIndex(index);\n      if (!point) return;\n      if (!this.selectionMode) {\n        this.selectOnly(index);\n        return;\n      }\n      const key = Number(point.index);"""),
              ("""      this.refreshActiveEditor();\n      this.renderChart();\n    }\n\n    clearSelection() {\n      this.selectedIndices.clear();\n      this.activeIndex = null;\n      this.refreshActiveEditor();\n      this.renderChart();""", """      this.refreshActiveEditor();\n      this.updateSelectionUi();\n      this.renderChart();\n    }\n\n    clearSelection() {\n      this.selectedIndices.clear();\n      this.activeIndex = null;\n      this.refreshActiveEditor();\n      this.updateSelectionUi();\n      this.renderChart();"""),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'curve anchor drifted: {old[:70]!r} count={s.count(old)}')
              s = s.replace(old, new, 1)

          old = """    prepareSelectionTarget() {\n      const indices = this.selectedPointIndices();\n      if (!indices.length) { this.alert('Selecione pelo menos um ponto da Curva K.'); return false; }\n      const requested = finite(document.getElementById('curveTargetFactor')?.value);\n      if (requested === null) { this.alert('Informe o fator K desejado.'); return false; }\n      let prepared = 0;\n      for (const index of indices) {\n        const preview = this.api.previewCurvePoint(index, requested);\n        if (!preview?.ok) continue;\n        this.acceptPreview(preview, true);\n        prepared += 1;\n      }\n      this.refreshActiveEditor();\n      this.renderChart();\n      this.renderProposalList();\n      if (!prepared) this.alert('Nenhum ponto selecionado produziu uma prévia válida.');\n      return prepared > 0;\n    }\n\n    prepareSuggestion(suggestion = this.pendingSuggestion, silent = false) {"""
          new = """    prepareSelectionTarget() {\n      const targetFactor = finite(document.getElementById('curveTargetFactor')?.value);\n      if (targetFactor === null) { this.alert('Informe o fator K desejado.'); return false; }\n      return this.assignSelectionTarget(targetFactor);\n    }\n\n    assignSelectionTarget(targetFactor) {\n      const indices = this.selectedPointIndices();\n      if (!indices.length) { this.alert('Selecione pelo menos um ponto da Curva K.'); return false; }\n      if (finite(targetFactor) === null) { this.alert('Informe um fator K válido.'); return false; }\n      let prepared = 0;\n      for (const index of indices) {\n        const preview = this.api.previewCurvePoint(index, targetFactor);\n        if (!preview?.ok) continue;\n        this.acceptPreview(preview, true);\n        prepared += 1;\n      }\n      this.refreshActiveEditor();\n      this.renderChart();\n      this.renderProposalList();\n      if (!prepared) this.alert('Nenhum ponto selecionado produziu uma prévia válida.');\n      return prepared > 0;\n    }\n\n    prepareSuggestion(suggestion = this.pendingSuggestion, silent = false) {"""
          if s.count(old) != 1:
              raise SystemExit('prepareSelectionTarget anchor drifted')
          s = s.replace(old, new, 1)

          old = """      if (!points.length) {\n        host.innerHTML = '<div class=\"chart-empty\">Leia a Curva K para visualizar os 30 pontos.</div>';\n        return;\n      }\n      const width = 920;"""
          new = """      if (!points.length) {\n        host.innerHTML = '<div class=\"chart-empty\">Leia a Curva K para visualizar os 30 pontos.</div>';\n        return;\n      }\n      const validIndices = new Set(points.map(item => Number(item.index)));\n      for (const index of [...this.selectedIndices]) if (!validIndices.has(Number(index))) this.selectedIndices.delete(index);\n      if (this.activeIndex !== null && !validIndices.has(Number(this.activeIndex))) this.activeIndex = null;\n      this.updateSelectionUi();\n      const width = 920;"""
          if s.count(old) != 1:
              raise SystemExit('render chart head anchor drifted')
          s = s.replace(old, new, 1).replace('r="18" tabindex="0" role="button"', 'r="22" tabindex="0" role="button"', 1)

          old = """        point.addEventListener('pointerdown', event => {\n          if (typeof event.button === 'number' && event.button !== 0) return;\n          event.preventDefault();\n          const key = index();\n          this.dragSelecting = true;"""
          new = """        point.addEventListener('pointerdown', event => {\n          if (typeof event.button === 'number' && event.button !== 0) return;\n          event.preventDefault();\n          const key = index();\n          if (!this.selectionMode) {\n            this.selectedIndices.clear();\n            this.selectedIndices.add(key);\n            this.activeIndex = key;\n            this.refreshActiveEditor();\n            this.updateSelectionUi();\n            syncSelectionClasses();\n            return;\n          }\n          this.dragSelecting = true;"""
          if s.count(old) != 1:
              raise SystemExit('pointerdown anchor drifted')
          s = s.replace(old, new, 1)
          old = """        point.addEventListener('pointerenter', () => {\n          if (!this.dragSelecting) return;"""
          new = """        point.addEventListener('pointerenter', () => {\n          if (!this.selectionMode || !this.dragSelecting) return;"""
          if s.count(old) != 1:
              raise SystemExit('pointerenter anchor drifted')
          s = s.replace(old, new, 1)
          old = """          this.activeIndex = key;\n          this.refreshActiveEditor();\n          syncSelectionClasses();\n        });\n        point.addEventListener('pointerenter'"""
          new = """          this.activeIndex = key;\n          this.refreshActiveEditor();\n          this.updateSelectionUi();\n          syncSelectionClasses();\n        });\n        point.addEventListener('pointerenter'"""
          if s.count(old) != 1:
              raise SystemExit('pointerdown update anchor drifted')
          s = s.replace(old, new, 1)
          old = """          this.activeIndex = key;\n          this.refreshActiveEditor();\n          syncSelectionClasses();\n        });\n        point.addEventListener('pointerup'"""
          new = """          this.activeIndex = key;\n          this.refreshActiveEditor();\n          this.updateSelectionUi();\n          syncSelectionClasses();\n        });\n        point.addEventListener('pointerup'"""
          if s.count(old) != 1:
              raise SystemExit('pointerenter update anchor drifted')
          s = s.replace(old, new, 1)
          old = """        this.dragStartWasSelected = false;\n        syncSelectionClasses();\n      };"""
          new = """        this.dragStartWasSelected = false;\n        this.updateSelectionUi();\n        syncSelectionClasses();\n      };"""
          if s.count(old) != 1:
              raise SystemExit('finishDrag anchor drifted')
          curve.write_text(s.replace(old, new, 1), encoding='utf-8')

          html = Path('app/src/main/assets/ui/index.html')
          s = html.read_text(encoding='utf-8')
          replacements = [
              ('''                  <div class="curve-legend"><span><i class="line actual"></i>Atual da ECU</span><span><i class="line proposal"></i>Proposta</span><span class="curve-point-hint">toque para selecionar · arraste para selecionar vários</span></div>''', '''                  <div class="curve-legend"><span><i class="line actual"></i>Atual da ECU</span><span><i class="line proposal"></i>Proposta</span><span class="curve-point-hint">Seleção OFF: toque escolhe 1 · ative Seleção para arrastar vários</span></div>'''),
              ('''                  <div class="editor-heading"><div><small>SELEÇÃO</small><h3 id="curveActivePoint">Selecione um ou vários pontos</h3></div><button id="curveClearSelection" type="button" class="quiet-button">Limpar seleção</button></div>''', '''                  <div class="editor-heading"><div><small>SELEÇÃO</small><h3 id="curveActivePoint">Selecione um ponto</h3><span id="curveSelectionCount">Seleção OFF · 0 selecionados</span></div><div class="curve-selection-actions"><button id="curveSelectionMode" type="button" class="secondary" aria-pressed="false">Ativar seleção</button><button id="curveClearSelection" type="button" class="quiet-button">Limpar seleção</button></div></div>'''),
              ('''                  <label class="field-label"><span>Fator desejado</span><input id="curveTargetFactor" type="number" inputmode="decimal" step="0.001" min="0.6" max="4"></label>''', '''                  <label class="field-label"><span>Definir valor exato</span><input id="curveTargetFactor" type="number" inputmode="decimal" step="0.001" min="0.6" max="4"><small>Ex.: 1,20 define todos os selecionados exatamente em 1,20.</small></label>'''),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'index anchor drifted count={s.count(old)}')
              s = s.replace(old, new, 1)
          html.write_text(s, encoding='utf-8')

          css = Path('app/src/main/assets/ui/styles-witness-multimedia.css')
          s = css.read_text(encoding='utf-8')
          old = '''.curve-point.selected {\n  stroke: var(--accent);\n  stroke-width: 4px;\n}\n.curve-point.active.selected { stroke-width: 5px; }\n#curveClearSelection { min-height: 40px; white-space: nowrap; }'''
          new = '''.curve-point.selected {\n  stroke: var(--accent);\n  stroke-width: 6px;\n  fill: rgba(87, 186, 255, .72);\n  filter: drop-shadow(0 0 8px rgba(87, 186, 255, .78));\n}\n.curve-point.active.selected { stroke-width: 7px; }\n.curve-selection-actions { display:flex; align-items:center; gap:8px; }\n#curveSelectionMode,\n#curveClearSelection { min-height: 44px; white-space: nowrap; }\n#curveSelectionCount { display:block; margin-top:4px; color:#8fb0c8; font-size:11px; font-weight:800; }'''
          if s.count(old) != 1:
              raise SystemExit('selection CSS anchor drifted')
          css.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify curve behavior and all browser contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/ui/screens/curve.js
          node --test tests/ui/curve-batch-edit.test.cjs tests/ui/blue-curve-native-authority.test.cjs tests/ui/curve-autocal-interoperability.test.cjs
          for test in tests/ui/*.test.cjs; do node --test "$test"; done

      - name: Commit issue 22 and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/blue-22-apply.yml
          git add -- app/src/main/assets/ui/screens/curve.js app/src/main/assets/ui/index.html app/src/main/assets/ui/styles-witness-multimedia.css
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(blue): harden Curva K batch selection #22"
          git push origin HEAD:work/omegas-blue-causal-engine
