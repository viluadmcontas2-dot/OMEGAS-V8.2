name: OmegasVerde ProgBase Finish AutoCal Proof

on:
  push:
    branches: [ OmegasVerde ]
    paths:
      - '.github/workflows/verde-progbase-finish-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finish-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 214b795e11f50f767de77115e3e2c48a9eba733d
      - name: Verify canonical ProgBase
        shell: bash
        run: |
          set -euo pipefail
          P=atlas/originals/progbase/ProgBase-4.2.0.6.exe
          test -s "$P"
          test "$(sha256sum "$P" | awk '{print $1}')" = "8a2d297c8c21ff3b4f7a47f7fe64593b0fec9014dd938bd91022dc0c68ac36f4"
      - name: Install deterministic disassembler
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6 pefile==2024.8.26
      - name: Disassemble Finish AutoCal surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p finish-proof
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32
          from capstone.x86 import X86_OP_IMM, X86_OP_MEM, X86_REG_EAX, X86_REG_EDX, X86_REG_ECX

          p=Path("atlas/originals/progbase/ProgBase-4.2.0.6.exe")
          data=p.read_bytes()
          sha=hashlib.sha256(data).hexdigest()
          assert sha=="8a2d297c8c21ff3b4f7a47f7fe64593b0fec9014dd938bd91022dc0c68ac36f4"
          pe=pefile.PE(str(p))
          image=int(pe.OPTIONAL_HEADER.ImageBase)

          def va_to_off(va):
              rva=va-image
              for s in pe.sections:
                  start=int(s.VirtualAddress)
                  size=max(int(s.Misc_VirtualSize),int(s.SizeOfRawData))
                  if start <= rva < start+size:
                      return int(s.PointerToRawData)+(rva-start)
              raise RuntimeError(hex(va))

          md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=True
          def disasm(start,end):
              raw=data[va_to_off(start):va_to_off(start)+(end-start)]
              out=[]
              for i in md.disasm(raw,start):
                  out.append({
                    "va":f"0x{i.address:08X}",
                    "bytes":i.bytes.hex(" ").upper(),
                    "mnemonic":i.mnemonic,
                    "op_str":i.op_str
                  })
              return out

          funcs={
            "ActionFinishAutocalExecute":[0x0051A390,0x0051A454],
            "BtnFinishAutomatchClick":[0x0051A454,0x0051A4D0],
            "FinishTail_005162F8":[0x005162F8,0x00516440],
          }
          result={"binary_sha256":sha,"functions":{}}
          for name,(start,end) in funcs.items():
              ins=disasm(start,end)
              result["functions"][name]=ins
              print("\n###",name)
              for x in ins:
                  print(f'{x["va"]}: {x["bytes"]:<24} {x["mnemonic"]:<8} {x["op_str"]}')
          Path("finish-proof/finish-proof.json").write_text(json.dumps(result,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: progbase-finish-autocal-proof
          path: finish-proof/
          if-no-files-found: error
