# Compilacao unica solicitada pelo proprietario em 2026-11-17.
# Somente a alteracao neste arquivo dispara o build; commits normais nao geram APK.
name: OMEGAS - APK pessoal de teste
on:
  push:
    branches:
      - feat/premium-adaptive-ui-v8-2
    paths:
      - .github/workflows/apk-pessoal-20261117.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: omegas-apk-pessoal-${{ github.sha }}
  cancel-in-progress: false
jobs:
  compilar:
    name: Gerar APK de teste
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Buscar o codigo exato
        uses: actions/checkout@v4
      - name: Identidade da versao
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compilar APK Android assinado de teste
        env:
          OMEGAS_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug -PomegasAbis=arm64-v8a --no-daemon --stacktrace
      - name: Confirmar integridade e preparar o arquivo
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p build/entrega
          cp "$APK" build/entrega/OMEGAS-uso-pessoal.apk
          {
            echo "OMEGAS para uso pessoal - compilacao de teste"
            echo "Origem: $GITHUB_SHA"
            echo "Arquivo: OMEGAS-uso-pessoal.apk"
            echo "SHA256: $(sha256sum "$APK" | awk '{print $1}')"
            echo "Arquitetura: arm64-v8a"
            echo "Assinatura: Android debug (nao substitui versao com outra assinatura)."
            echo "Compilacao e testes automaticos NAO comprovam USB/ECU reais."
            echo "Nao use em operacoes criticas enquanto a compatibilidade nao for verificada."
          } > build/entrega/LEIA-ANTES-DE-INSTALAR.txt
      - name: Guardar o APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: OMEGAS-APK-TESTE-${{ github.sha }}
          path: build/entrega/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  verificar:
    name: Confirmar testes da mesma versao
    needs: compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Conferir resultado dos testes existentes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            RESULT="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" --jq '[.workflow_runs[] | select(.name == "OMEGAS CI" and .event == "push") | "\(.status):\(.conclusion)"] | first // "notfound"' 2>/dev/null || echo unavailable)"
            echo "Verificacao da versao: $RESULT"
            if [ "$RESULT" = "completed:success" ]; then
              exit 0
            fi
            case "$RESULT" in
              completed:failure|completed:cancelled|completed:timed_out|completed:action_required)
                echo "Os testes desta versao nao passaram."
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Os testes desta versao nao terminaram a tempo."
          exit 1
  liberar:
    name: Publicar candidato instalavel verificado
    needs: [compilar, verificar]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OMEGAS-APK-TESTE-${{ github.sha }}
          path: build/entrega
      - uses: actions/upload-artifact@v4
        with:
          name: OMEGAS-INSTALAR-${{ github.sha }}
          path: build/entrega/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
