# OMEGAS Blue remote CI.
# Push CI proves software readiness only. APK generation remains an explicit owner-authorized manual gate.
# Manual APK authorization is either workflow_dispatch(build_apk=true) or an explicit owner-triggered re-run attempt of the APK job.
# A first-attempt ordinary push never generates an APK.
# Every readiness claim must come from a fresh exact-SHA run after publication and cleanup.
name: OMEGAS Blue CI

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Owner-authorized APK generation after READY FOR APK GENERATION"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - work/omegas-blue-causal-engine
    paths:
      - "app/**"
      - "tests/**"
      - "tools/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "package.json"
      - "package-lock.json"
      - "STATUS.md"
      - "docs/workunits/OMEGAS-BLUE-ALGO-VERIFY-001.md"
      - ".github/workflows/blue-ci.yml"

permissions:
  contents: read

concurrency:
  group: omegas-blue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: FAST contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v7
      - name: Prove source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$GITHUB_SHA"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"
      - name: Fast Python and Node contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/run_checks.py

  full:
    name: FULL JVM lint
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v7
      - name: Set up JDK 17 with Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
      - name: Full JVM and lint only
        shell: bash
        env:
          OMEGAS_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintDebug \
            -PomegasAbis=armeabi-v7a \
            --no-daemon --stacktrace
      - name: Mark software ready for artifact gate
        shell: bash
        run: |
          echo "READY_FOR_APK_GENERATION=true"
          echo "SOURCE_SHA=$GITHUB_SHA"
          echo "APK_GENERATED=false"

  apk:
    name: Owner-authorized APK artifact
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_apk == true) || (github.event_name == 'push' && github.run_attempt > 1 && github.triggering_actor == github.repository_owner) }}
    needs: [fast, full]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v7
      - name: Set up JDK 17 with Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
      - name: Assemble owner-authorized APK
        shell: bash
        env:
          OMEGAS_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug -PomegasAbis=armeabi-v7a --no-daemon --stacktrace
      - name: Emit exact-SHA artifact evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -f "$APK"
          AUTH_MODE="workflow_dispatch"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then AUTH_MODE="owner_rerun"; fi
          mkdir -p build/evidence
          RECEIPT=build/evidence/omegas-blue-apk.txt
          {
            echo "OMEGAS_BLUE_APK_GATE=PASS"
            echo "OWNER_AUTHORIZED=true"
            echo "OWNER_AUTHORIZATION_MODE=$AUTH_MODE"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"
            echo "APK_PATH=$APK"
            echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"
            echo "APK_BYTES=$(stat -c %s "$APK")"
            echo "SIMULATED_ECU_ONLY=true"
            echo "NO_INSTALL_PERFORMED=true"
            echo "PHYSICAL_FUEL_ECONOMY_CLAIMED=false"
          } | tee "$RECEIPT"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
      - name: Independently verify APK receipt
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          RECEIPT=build/evidence/omegas-blue-apk.txt
          test -f "$APK"
          test -f "$RECEIPT"
          RECEIPT_SHA="$(sed -n 's/^APK_SHA256=//p' "$RECEIPT")"
          RECEIPT_BYTES="$(sed -n 's/^APK_BYTES=//p' "$RECEIPT")"
          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          ACTUAL_BYTES="$(stat -c %s "$APK")"
          test -n "$RECEIPT_SHA"
          test -n "$RECEIPT_BYTES"
          test "$ACTUAL_SHA" = "$RECEIPT_SHA"
          test "$ACTUAL_BYTES" = "$RECEIPT_BYTES"
          echo "APK_RECEIPT_VERIFICATION=PASS"
          echo "VERIFIED_APK_SHA256=$ACTUAL_SHA"
          echo "VERIFIED_APK_BYTES=$ACTUAL_BYTES"
      - name: Upload owner-authorized APK and evidence
        uses: actions/upload-artifact@v6
        with:
          name: omegas-blue-${{ github.sha }}
          path: |
            ${{ steps.evidence.outputs.apk_path }}
            build/evidence/omegas-blue-apk.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
