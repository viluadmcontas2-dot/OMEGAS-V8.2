name: OMEGAS targeted ProgBase point-click proof

on:
  push:
    branches: [ OmegasVerde ]
    paths:
      - '.github/workflows/verde-progbase-point-click-proof.yml'

permissions:
  contents: read
  actions: read

jobs:
  prove-point-click:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - name: Reuse corrected remote Atlas undelphi artifact
        uses: actions/download-artifact@v4
        with:
          name: atlas-undelphi-index
          path: atlas-undelphi
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35755928817

      - name: Extract AutoCal click bindings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p point-proof
          {
            echo "SOURCE_RUN=35755928817"
            echo "SOURCE_ARTIFACT=atlas-undelphi-index"
            echo "CANONICAL_PROGBASE_SHA256=8a2d297c8c21ff3b4f7a47f7fe64593b0fec9014dd938bd91022dc0c68ac36f4"
            echo
            echo "== FILES =="
            find atlas-undelphi -maxdepth 3 -type f -print | sort
            echo
            echo "== AUTOCAL CLICK / SERIES MATCHES =="
            grep -RinE -C 5 '(_GasPoint|_PetrolPoint|GasPoint|PetrolPoint|AcqusitionAreas|AcquisitionAreas|OnClick|OnMouse|ChartData)' atlas-undelphi || true
          } | tee point-proof/undelphi-click-bindings.txt

          test -s point-proof/undelphi-click-bindings.txt

      - name: Recover handler addresses and targeted disassembly
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check capstone==5.0.6 pefile==2024.8.26 >/dev/null
          git fetch --no-tags --depth=1 origin 214b795e11f50f767de77115e3e2c48a9eba733d
          git show 214b795e11f50f767de77115e3e2c48a9eba733d:atlas/originals/progbase/ProgBase-4.2.0.6.exe > /tmp/ProgBase.exe
          test "$(sha256sum /tmp/ProgBase.exe | awk '{print $1}')" = "8a2d297c8c21ff3b4f7a47f7fe64593b0fec9014dd938bd91022dc0c68ac36f4"

          python3 - <<'PY' | tee point-proof/targeted-disassembly.txt
          import re, struct
          from pathlib import Path
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32

          root=Path("atlas-undelphi")
          texts=[]
          for p in root.rglob("*"):
              if p.is_file():
                  try:
                      texts.append((str(p),p.read_text(encoding="utf-8",errors="ignore")))
                  except Exception:
                      pass

          targets={
              "PointHelper_518B80": 0x00518B80,
              "PointHelper_518D60": 0x00518D60,
              "PointHelper_518D94": 0x00518D94,
              "PointHelper_518DF8": 0x00518DF8,
              "PointDeleteCommit_512300": 0x00512300,
              "PointDeleteContext_512254": 0x00512254,
              "PointDeleteModel_512858": 0x00512858,
              "ActionDeleteSelectedPointsExecute": 0x00518E6C,
              "MenuChartDataPopup": 0x005190A0,
              "PointHelper_519144": 0x00519144,
              "PointHelper_519354": 0x00519354,
          }
          wanted=re.compile(r"(AcqusitionAreas\d*Click|AcquisitionAreas\d*Click|GasPoint\w*Click|PetrolPoint\w*Click|ChartDataClickSeries|ChartDataDblClick|ChartDataMouseUp|ChartDataKeyDown|ChartDataKeyUp|ChartDataClickAxis)",re.I)
          method_line=re.compile(r"(0x[0-9a-fA-F]{6,8})\s+([A-Za-z_]\w*)")
          for fn,text in texts:
              for line in text.splitlines():
                  m=method_line.search(line)
                  if m and wanted.search(m.group(2)):
                      targets[m.group(2)]=int(m.group(1),16)

          print("TARGETS", {k:f"0x{v:08X}" for k,v in sorted(targets.items())})
          if not targets:
              print("NO_TARGET_HANDLER_ADDRESS_RECOVERED")
              raise SystemExit(0)

          data=Path("/tmp/ProgBase.exe").read_bytes()
          pe=pefile.PE("/tmp/ProgBase.exe",fast_load=False)
          image=int(pe.OPTIONAL_HEADER.ImageBase)
          def va_to_off(va):
              rva=va-image
              for s in pe.sections:
                  start=int(s.VirtualAddress); size=max(int(s.Misc_VirtualSize),int(s.SizeOfRawData))
                  if start<=rva<start+size:
                      return int(s.PointerToRawData)+(rva-start)
              return None
          md=Cs(CS_ARCH_X86,CS_MODE_32)

          # Build a best-effort address→Delphi symbol map from the exact undelphi artifact.
          symbols={}
          for _,text in texts:
              for line in text.splitlines():
                  m=method_line.search(line)
                  if m:
                      symbols.setdefault(int(m.group(1),16),m.group(2))

          discovered_calls=set()
          for name,va in sorted(targets.items()):
              off=va_to_off(va)
              print(f"\n== {name} @ 0x{va:08X} ==")
              if off is None:
                  print("VA_NOT_MAPPED"); continue
              calls=[]
              for n,ins in enumerate(md.disasm(data[off:off+768],va)):
                  print(f"{ins.address:08X}: {ins.bytes.hex(' ').upper():<28} {ins.mnemonic:<8} {ins.op_str}")
                  if ins.mnemonic=="call":
                      try:
                          target=int(ins.op_str,0)
                          calls.append(target)
                          if 0x00510000 <= target <= 0x0051B000:
                              discovered_calls.add(target)
                      except Exception:
                          pass
                  if ins.mnemonic.startswith("ret") or n>=220: break
              print("DIRECT_CALLS", [
                  f"0x{x:08X}" + (f"={symbols[x]}" if x in symbols else "")
                  for x in calls
              ])

          print("\n== ONE-LEVEL INTERNAL CALLEES ==")
          for va in sorted(discovered_calls - set(targets.values())):
              off=va_to_off(va)
              print(f"\n== 0x{va:08X} {symbols.get(va,'')} ==")
              if off is None:
                  print("VA_NOT_MAPPED"); continue
              calls=[]
              for n,ins in enumerate(md.disasm(data[off:off+512],va)):
                  print(f"{ins.address:08X}: {ins.bytes.hex(' ').upper():<28} {ins.mnemonic:<8} {ins.op_str}")
                  if ins.mnemonic=="call":
                      try: calls.append(int(ins.op_str,0))
                      except Exception: pass
                  if ins.mnemonic.startswith("ret") or n>=160: break
              print("DIRECT_CALLS", [
                  f"0x{x:08X}" + (f"={symbols[x]}" if x in symbols else "")
                  for x in calls
              ])
          PY

      - name: Resolve point-delete data model and writer semantics
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "== UNDELPHI METHODS AROUND 0x00512xxx =="
            grep -Ein -C 10 '0x00512[0-9a-fA-F]{3}' atlas-undelphi/undelphi.txt || true
            echo
            echo "== AUTOCAL DATA-MODEL NAMES =="
            grep -Ein -C 8 '(TAutoCal|AutoCal.*Data|Data.*AutoCal|Acquisition.*Data|Acqusition.*Data|NumBuf|TBuf|MUL_ACT|MNFLD)' atlas-undelphi/undelphi.txt || true
          } | tee point-proof/model-rtti.txt

          python3 - <<'PY' | tee point-proof/writer-callgraph.txt
          import struct
          from pathlib import Path
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32

          exe=Path("/tmp/ProgBase.exe")
          data=exe.read_bytes()
          pe=pefile.PE(str(exe),fast_load=False)
          image=int(pe.OPTIONAL_HEADER.ImageBase)
          text=next(s for s in pe.sections if s.Name.rstrip(b'\0')==b'.text')
          text_va=image+int(text.VirtualAddress)
          text_off=int(text.PointerToRawData)
          text_bytes=data[text_off:text_off+int(text.SizeOfRawData)]

          def va_to_off(va):
              rva=va-image
              for s in pe.sections:
                  start=int(s.VirtualAddress); size=max(int(s.Misc_VirtualSize),int(s.SizeOfRawData))
                  if start<=rva<start+size:
                      return int(s.PointerToRawData)+(rva-start)
              return None

          # Parse all recovered Delphi method symbols.
          symbols={}
          txt=Path("atlas-undelphi/undelphi.txt").read_text(encoding="utf-8",errors="ignore")
          import re
          for m in re.finditer(r'0x([0-9a-fA-F]{8})\s+([A-Za-z_]\w*)',txt):
              symbols[int(m.group(1),16)]=m.group(2)

          def nearest_symbol(va):
              candidates=[x for x in symbols if x<=va]
              if not candidates: return None
              a=max(candidates)
              return a,symbols[a],va-a

          target=0x009244C8
          # x86 CALL rel32: destination = next_ip + signed displacement.
          sites=[]
          for i in range(len(text_bytes)-5):
              if text_bytes[i]!=0xE8: continue
              disp=struct.unpack_from("<i",text_bytes,i+1)[0]
              site=text_va+i
              dest=site+5+disp
              if dest==target:
                  sites.append(site)

          print("WRITER_TARGET=0x%08X"%target)
          print("CALL_SITE_COUNT",len(sites))
          for site in sites:
              print("\nCALL_SITE 0x%08X nearest=%r"%(site,nearest_symbol(site)))
              start=max(text_va,site-96)
              off=va_to_off(start)
              md=Cs(CS_ARCH_X86,CS_MODE_32)
              for ins in md.disasm(data[off:off+192],start):
                  prefix=">>" if ins.address==site else "  "
                  print(f"{prefix} {ins.address:08X}: {ins.bytes.hex(' ').upper():<28} {ins.mnemonic:<8} {ins.op_str}")
                  if ins.address>site+48: break

          print("\n== GENERIC WRITER 0x009244C8 ==")
          off=va_to_off(target)
          md=Cs(CS_ARCH_X86,CS_MODE_32)
          for n,ins in enumerate(md.disasm(data[off:off+1200],target)):
              print(f"{ins.address:08X}: {ins.bytes.hex(' ').upper():<28} {ins.mnemonic:<8} {ins.op_str}")
              if ins.mnemonic.startswith("ret") or n>=320: break

          # Dump the two functions adjacent to the point-delete commit gate.
          for va in (0x00512264,0x00512300):
              print(f"\n== TARGET 0x{va:08X} {symbols.get(va,'')} ==")
              off=va_to_off(va)
              for n,ins in enumerate(md.disasm(data[off:off+1100],va)):
                  print(f"{ins.address:08X}: {ins.bytes.hex(' ').upper():<28} {ins.mnemonic:<8} {ins.op_str}")
                  if ins.mnemonic.startswith("ret") or n>=300: break
          PY

      - name: Dump delete-mask resource bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee point-proof/delete-mask-bytes.txt
          from pathlib import Path
          data=Path("/tmp/ProgBase.exe").read_bytes()
          for name in ("GAS_POINT_2DELETE","PETROL_POINT_2DELETE","ACQUIRED_ZONES_PETROL","ACQUIRED_ZONES_GAS"):
              needle=name.encode()
              print("\n==",name,"==")
              p=0
              while True:
                  p=data.find(needle,p)
                  if p<0: break
                  print("OFFSET",hex(p))
                  lo=max(0,p-192); hi=min(len(data),p+512)
                  blob=data[lo:hi]
                  for row in range(0,len(blob),16):
                      chunk=blob[row:row+16]
                      asc=''.join(chr(x) if 32<=x<127 else '.' for x in chunk)
                      print(f"{lo+row:08X}  {' '.join(f'{x:02X}' for x in chunk):<47} {asc}")
                  p+=1
          PY

      - name: Prove TAebVector ECU persistence path
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "== UNDELPHI AEB VECTOR/PROTOCOL SYMBOLS =="
            grep -Ein -C 8 '(TAebVector|SetDataInEcu|SetByAddress|SetVector|SetNumber|AebProtocol)' atlas-undelphi/undelphi.txt || true
          } | tee point-proof/aeb-vector-symbols.txt

          python3 - <<'PY' | tee point-proof/aeb-vector-writer-disasm.txt
          from pathlib import Path
          import re, pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32

          data=Path("/tmp/ProgBase.exe").read_bytes()
          pe=pefile.PE("/tmp/ProgBase.exe",fast_load=False)
          image=int(pe.OPTIONAL_HEADER.ImageBase)

          def va_to_off(va):
              rva=va-image
              for s in pe.sections:
                  start=int(s.VirtualAddress); size=max(int(s.Misc_VirtualSize),int(s.SizeOfRawData))
                  if start<=rva<start+size:
                      return int(s.PointerToRawData)+(rva-start)
              return None

          txt=Path("atlas-undelphi/undelphi.txt").read_text(encoding="utf-8",errors="ignore")
          symbols={}
          for m in re.finditer(r'0x([0-9a-fA-F]{8})\s+([A-Za-z_]\w*)',txt):
              symbols[int(m.group(1),16)]=m.group(2)

          md=Cs(CS_ARCH_X86,CS_MODE_32)
          targets={
              "TAebVector_SetData":0x00979534,
              "TAebVector_SetDataInEcu":0x009796B8,
              "TAebVector_SetDouble":0x00979EE8,
              "TAebVector_Helper_975FD0":0x00975FD0,
              "TAebVector_Helper_979D28":0x00979D28,
          }
          discovered=set()
          for name,va in targets.items():
              print(f"\n== {name} @ 0x{va:08X} symbol={symbols.get(va,'')} ==")
              off=va_to_off(va)
              if off is None:
                  print("VA_NOT_MAPPED"); continue
              for n,ins in enumerate(md.disasm(data[off:off+1800],va)):
                  print(f"{ins.address:08X}: {ins.bytes.hex(' ').upper():<28} {ins.mnemonic:<8} {ins.op_str}")
                  if ins.mnemonic=="call":
                      try:
                          target=int(ins.op_str,0)
                          if 0x00900000 <= target <= 0x00990000:
                              discovered.add(target)
                      except Exception:
                          pass
                  if ins.mnemonic.startswith("ret") or n>=450: break

          print("\nDISCOVERED_AEB_CALLS",[
              f"0x{x:08X}" + (f"={symbols[x]}" if x in symbols else "")
              for x in sorted(discovered)
          ])
          for va in sorted(discovered - set(targets.values())):
              label=symbols.get(va,"")
              if not re.search(r'(aeb|protocol|set|write|data)',label,re.I):
                  continue
              print(f"\n== DISCOVERED 0x{va:08X} {label} ==")
              off=va_to_off(va)
              if off is None: continue
              for n,ins in enumerate(md.disasm(data[off:off+1400],va)):
                  print(f"{ins.address:08X}: {ins.bytes.hex(' ').upper():<28} {ins.mnemonic:<8} {ins.op_str}")
                  if ins.mnemonic.startswith("ret") or n>=350: break
          PY

      - name: Publish targeted proof
        uses: actions/upload-artifact@v4
        with:
          name: progbase-point-click-proof
          path: point-proof/
          if-no-files-found: error
          retention-days: 7
