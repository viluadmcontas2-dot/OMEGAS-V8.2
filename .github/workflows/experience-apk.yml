# Owner-approved release verification, 1280x720. APK job only runs for the original approval revision.
name: Omegas Experience authorized APK
on:
  pull_request:
    branches: [ OmegasDiamante ]
    paths: [ '.github/workflows/experience-apk.yml' ]
permissions:
  contents: read
jobs:
  approved-apk:
    if: ${{ github.head_ref == 'work/platina-diamante-ui' && github.event.pull_request.head.sha == '9d597dc7e87921f169b98591f0c9da4723661653' }}
    uses: ./.github/workflows/verde-apk-now.yml
    with:
      build_apk: true
      source_sha: '963980452de4d5a81491da5a9553713fe09b4333'
  multimedia-render:
    if: ${{ github.head_ref == 'work/platina-diamante-ui' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '963980452de4d5a81491da5a9553713fe09b4333'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          test -e /dev/kvm
      - name: Exercise real WebView at 1280x720
        env:
          OMEGAS_SOURCE_SHA: '963980452de4d5a81491da5a9553713fe09b4333'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-build: 15917651
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          script: |
            bash tools/ci/run_android_render_evidence.sh autocal-visible-actions autocalVisibleReacquireActionsForMultimedia DashboardLevelsRenderTest
            bash tools/ci/run_android_render_evidence.sh map-fresh-context mapFreshMp48ContextRender DashboardLevelsRenderTest
            bash tools/ci/run_android_render_evidence.sh curve-original-lognovo curveOriginalLognovoRendersThirtyDecodedPoints DashboardLevelsRenderTest
            bash tools/ci/run_android_render_evidence.sh refino-latencia-da-ponte refinoLatenciaDaPonte RefinoRenderTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experience-1280x720-render-evidence
          path: rendered-evidence
          if-no-files-found: warn
