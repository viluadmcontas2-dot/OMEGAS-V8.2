# Platina AutoCal cockpit layout regression
name: AutoCal Platina layout regression
on:
  push:
    branches: [OmegasPlatina]
    paths:
      - 'app/src/main/assets/ui/styles-autocal-cockpit.css'
      - 'app/src/main/assets/ui/screens/autocal-cockpit.js'
      - 'tools/ci/autocal_blueprint_layout.cjs'
      - 'tools/ci/sem_rolagem_abas.cjs'
      - 'app/src/main/assets/ui/**'
      - '.github/workflows/autocal-blueprint-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix /tmp/omegas-ui-test playwright@1.56.1
          /tmp/omegas-ui-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify AutoCal multimedia layout
        env:
          NODE_PATH: /tmp/omegas-ui-test/node_modules
        run: node tools/ci/autocal_blueprint_layout.cjs
      # Trava do dono (2026-10-11): nenhuma das 8 abas rola, nada cortado, nav sempre visível, sem "Abas".
      - name: Verify no tab scrolls (8 tabs, 1280x672 and 1280x720)
        env:
          NODE_PATH: /tmp/omegas-ui-test/node_modules
        run: node tools/ci/sem_rolagem_abas.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autocal-platina-layout
          path: build/ui-evidence
