name: OMEGAS Blue OBD evaluate one-shot

on:
  push:
    branches:
      - work/omegas-blue-causal-engine
    paths:
      - .github/workflows/obd-evaluate-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact staging SHA
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Prove lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "40231fabe1db42e4dc8b5198ad16cfd620f3ff21"
      - name: Keep evaluate in learning and bridge outside
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/omegas/prohub/service/TelemetryForegroundService.kt')
          s = p.read_text(encoding='utf-8')
          old_import = 'import com.omegas.prohub.obd.ObdLearningSample\n'
          new_import = old_import + 'import com.omegas.prohub.obd.ObdLearningResult\n'
          if old_import not in s or 'import com.omegas.prohub.obd.ObdLearningResult\n' in s:
              raise SystemExit('ObdLearningResult import seam invalid')
          s = s.replace(old_import, new_import, 1)
          old = '''        persistObdLearning()\n        val witness = buildObdWitness(learningSample)\n'''
          new = '''        val result = obdLearningEngine.evaluate(learningSample.rpm, learningSample.mapBar)\n        persistObdLearning()\n        val witness = buildObdWitness(learningSample, result)\n'''
          if s.count(old) != 1:
              raise SystemExit('consume seam not found exactly once')
          s = s.replace(old, new, 1)
          old_helper = '''    private fun buildObdWitness(learningSample: ObdLearningSample): JSONObject {\n        val result = obdLearningEngine.evaluate(learningSample.rpm, learningSample.mapBar)\n'''
          new_helper = '''    private fun buildObdWitness(\n        learningSample: ObdLearningSample,\n        result: ObdLearningResult,\n    ): JSONObject {\n'''
          if s.count(old_helper) != 1:
              raise SystemExit('helper seam not found exactly once')
          s = s.replace(old_helper, new_helper, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          python3 -B tests/test_blue_obd_independent_runtime_contract.py
          python3 -B tests/test_blue_obd_witness_runtime_pairing_contract.py
          python3 -B tests/test_blue_hot_path_contract.py
          python3 -B tests/test_blue_functional_recovery_contract.py
      - name: Commit product fix and fast-forward only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/obd-evaluate-once.yml
          git diff --check
          git config user.name "OMEGAS Blue CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(blue): preserve independent OBD evaluate seam (#32 #33)"
          git fetch origin work/omegas-blue-causal-engine
          test "$(git rev-parse refs/remotes/origin/work/omegas-blue-causal-engine)" = "$GITHUB_SHA"
          echo "FIX_SHA=$(git rev-parse HEAD)"
          echo "FIX_TREE=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:refs/heads/work/omegas-blue-causal-engine
