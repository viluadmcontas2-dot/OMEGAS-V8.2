name: Diamante elastic UI evidence
on:
  pull_request:
    branches: [OmegasDiamante]
permissions:
  contents: read
jobs:
  regression:
    if: ${{ (github.head_ref == 'work/platina-diamante-ui' || github.head_ref == 'work/platina-autocal-coerencia' || github.head_ref == 'work/platina-live-acquisition') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ui/diamante-elastic.test.cjs
      - name: Premium static owner audit
        run: python3 tools/ui/audit_premium.py . --mode strict --output premium-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-ui-audit
          path: premium-audit.json
