name: Phase 05 final source verification

on:
  push:
    branches:
      - rebuild/v8.2-final-implementation
    paths:
      - ci/phase5-final-verify.txt

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Candidate identity
        run: |
          echo "PHASE5_VERIFY_SHA=$(git rev-parse HEAD)"
          git status --short

      - name: Structural and behavioral contracts
        run: python -m pytest -q tests

      - name: JVM unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug
