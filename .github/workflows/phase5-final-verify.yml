name: Phase 05 final source verification

on:
  push:
    branches:
      - rebuild/v8.2-final-implementation
    paths:
      - ci/phase5-final-verify.txt

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Candidate identity
        run: |
          echo "PHASE5_VERIFY_SHA=$(git rev-parse HEAD)"
          git status --short

      - name: Structural and behavioral contracts
        id: pytest
        continue-on-error: true
        run: python -m pytest -q tests

      - name: JVM unit tests
        id: jvm
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Android lint
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Publish bounded verification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          JVM_OUTCOME: ${{ steps.jvm.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          if [ "$PYTEST_OUTCOME" = "success" ] && [ "$JVM_OUTCOME" = "success" ] && [ "$LINT_OUTCOME" = "success" ]; then
            state="success"
            description="Phase 05 pytest + JVM + lint passed"
          else
            state="failure"
            description="Phase 05 failed: pytest=$PYTEST_OUTCOME jvm=$JVM_OUTCOME lint=$LINT_OUTCOME"
          fi
          payload=$(jq -nc --arg state "$state" --arg context "omegas/phase5-final" --arg description "$description" '{state:$state,context:$context,description:$description}')
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
          [ "$state" = "success" ]
