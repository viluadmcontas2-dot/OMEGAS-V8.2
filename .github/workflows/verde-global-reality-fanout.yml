name: OmegasVerde global reality fanout

on:
  workflow_dispatch:
  push:
    branches: [OmegasVerde]
    paths:
      - '.github/workflows/verde-global-reality-fanout.yml'
      - 'tools/ci/global_reality_plan.py'
      - 'tools/ci/global_reality_lane.py'
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'tests/ui/**'
      - 'tests/test_*.py'
      - 'tests/fixtures/**'

permissions:
  contents: read

concurrency:
  group: omegas-verde-global-reality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          MATRIX="$(python3 tools/ci/global_reality_plan.py)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess
          x=json.loads(subprocess.check_output(["python3","tools/ci/global_reality_plan.py"],text=True))
          print("count="+str(len(x["include"])))
          PY

  lane:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 80
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        if: ${{ matrix.kind == 'jvm' || matrix.kind == 'jvm_node' }}
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prepare
        run: chmod +x gradlew
      - name: Execute isolated product contract
        run: |
          python3 tools/ci/global_reality_lane.py             --id "${{ matrix.id }}"             --kind "${{ matrix.kind }}"             --target "${{ matrix.target }}"             --receipt "global-reality/${{ matrix.id }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-${{ matrix.id }}
          path: global-reality/${{ matrix.id }}.json
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  aggregate:
    if: always()
    needs: [plan, lane]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: global-*
          path: global-reality
          merge-multiple: true
      - name: Aggregate global contracts
        shell: bash
        env:
          EXPECTED: ${{ needs.plan.outputs.count }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,json,os,pathlib
          files=sorted(pathlib.Path("global-reality").glob("*.json"))
          rows=[json.loads(p.read_text("utf-8")) for p in files]
          c=collections.Counter(r["status"] for r in rows)
          expected=int(os.environ["EXPECTED"])
          out={"expected":expected,"count":len(rows),"statuses":dict(c),"reds":[r for r in rows if r["status"]!="PASS"]}
          pathlib.Path("global-reality-summary.json").write_text(json.dumps(out,indent=2,ensure_ascii=False)+"\n","utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write(f"# Global reality fan-out\n\nExpected **{expected}**, receipts **{len(rows)}**, PASS **{c['PASS']}**, RED **{c['RED']}**.\n")
              for r in out["reds"]:
                  f.write(f"- RED `{r['id']}` — `{r['target']}`\n")
          if len(rows)!=expected: raise SystemExit(f"receipt count mismatch {len(rows)} != {expected}")
          if c["RED"]: raise SystemExit(f"{c['RED']} global lanes RED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-reality-summary
          path: global-reality-summary.json
          retention-days: 5
