name: "Blue #20 apply"

on:
  push:
    branches:
      - work/omegas-blue-causal-engine
    paths:
      - ".github/workflows/blue-20-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v7
        with:
          ref: work/omegas-blue-causal-engine
          fetch-depth: 0

      - name: Apply issue 20 telemetry freshness and overlay fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          store = Path('app/src/main/java/com/omegas/prohub/telemetry/TelemetryStateStore.kt')
          s = store.read_text(encoding='utf-8')
          old = '    private var telemetryUpdatedAt = 0L\n'
          new = '''    // Physical/source time of the newest MP48 frame, not delivery receipt time.\n    private var telemetryUpdatedAt = 0L\n    private var telemetryDeliveredAt = 0L\n    private var telemetryDeliveryDelayMs = -1L\n'''
          if s.count(old) != 1:
              raise SystemExit(f'telemetry field anchor drifted count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''            val isTelemetry = event == "telemetry" || payload.has("rpm")\n            if (isTelemetry) {\n                // Freshness answers when the native service actually received a\n                // usable frame. Historical matching below preserves the frame's\n                // physical timestamp independently so OBD pairing cannot make\n                // service freshness stale by construction.\n                telemetryUpdatedAt = now\n                valid = true\n            }\n            val seq = sequence.incrementAndGet()\n            if (isTelemetry) {\n                val observedAtMs = physicalObservedAtMs(root, payload, now)\n'''
          new = '''            val isTelemetry = event == "telemetry" || payload.has("rpm")\n            val observedAtMs = if (isTelemetry) {\n                physicalObservedAtMs(root, payload, now).coerceIn(1L, now)\n            } else {\n                0L\n            }\n            if (isTelemetry) {\n                // Freshness follows the physical frame time carried by the engine.\n                // Receipt time is tracked separately so a slow delivery consumer\n                // cannot make an old frame look fresh.\n                telemetryUpdatedAt = observedAtMs\n                telemetryDeliveredAt = now\n                telemetryDeliveryDelayMs = (now - observedAtMs).coerceAtLeast(0L)\n                valid = true\n            }\n            val seq = sequence.incrementAndGet()\n            if (isTelemetry) {\n'''
          if s.count(old) != 1:
              raise SystemExit(f'freshness anchor drifted count={s.count(old)}')
          s = s.replace(old, new, 1)
          reset = '''        telemetryUpdatedAt = 0L\n        telemetry = JSONObject()\n'''
          reset_new = '''        telemetryUpdatedAt = 0L\n        telemetryDeliveredAt = 0L\n        telemetryDeliveryDelayMs = -1L\n        telemetry = JSONObject()\n'''
          if s.count(reset) != 2:
              raise SystemExit(f'reset anchors drifted count={s.count(reset)}')
          s = s.replace(reset, reset_new, 2)
          old = '''                if (frameAtMs in 1..now && frameAtMs > telemetryUpdatedAt) {\n                    telemetryUpdatedAt = frameAtMs\n                }\n'''
          new = '''                if (frameAtMs in 1..now && frameAtMs > telemetryUpdatedAt) {\n                    telemetryUpdatedAt = frameAtMs\n                    telemetryDeliveredAt = now\n                    telemetryDeliveryDelayMs = (now - frameAtMs).coerceAtLeast(0L)\n                }\n'''
          if s.count(old) != 1:
              raise SystemExit(f'full snapshot freshness anchor drifted count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''.put("stateUpdatedAt", stateUpdatedAt)\n            .put("ageMs", if (telemetryUpdatedAt == 0L) -1 else System.currentTimeMillis() - telemetryUpdatedAt)\n'''
          new = '''.put("stateUpdatedAt", stateUpdatedAt)\n            .put("deliveredAt", telemetryDeliveredAt)\n            .put("deliveryDelayMs", telemetryDeliveryDelayMs)\n            .put("deliveryAgeMs", if (telemetryDeliveredAt == 0L) -1 else System.currentTimeMillis() - telemetryDeliveredAt)\n            .put("ageMs", if (telemetryUpdatedAt == 0L) -1 else System.currentTimeMillis() - telemetryUpdatedAt)\n'''
          if s.count(old) != 1:
              raise SystemExit(f'lightweight diagnostics anchor drifted count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''.put("updatedAt", telemetryUpdatedAt)\n            .put("ageMs", if (telemetryUpdatedAt == 0L) -1 else System.currentTimeMillis() - telemetryUpdatedAt)\n'''
          new = '''.put("updatedAt", telemetryUpdatedAt)\n            .put("deliveredAt", telemetryDeliveredAt)\n            .put("deliveryDelayMs", telemetryDeliveryDelayMs)\n            .put("deliveryAgeMs", if (telemetryDeliveredAt == 0L) -1 else System.currentTimeMillis() - telemetryDeliveredAt)\n            .put("ageMs", if (telemetryUpdatedAt == 0L) -1 else System.currentTimeMillis() - telemetryUpdatedAt)\n'''
          if s.count(old) != 1:
              raise SystemExit(f'live diagnostics anchor drifted count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''        result.put("native_updated_at", telemetryUpdatedAt)\n        result.put("native_state_updated_at", stateUpdatedAt)\n'''
          new = '''        result.put("native_updated_at", telemetryUpdatedAt)\n        result.put("native_delivered_at", telemetryDeliveredAt)\n        result.put("native_delivery_delay_ms", telemetryDeliveryDelayMs)\n        result.put("native_state_updated_at", stateUpdatedAt)\n'''
          if s.count(old) != 1:
              raise SystemExit(f'full diagnostics anchor drifted count={s.count(old)}')
          store.write_text(s.replace(old, new, 1), encoding='utf-8')

          test = Path('app/src/test/java/com/omegas/prohub/telemetry/TelemetryStateStoreTest.kt')
          s = test.read_text(encoding='utf-8')
          anchor = '''    private fun event(sessionId: Long, rpm: Int): String = JSONObject()\n'''
          addition = '''    @Test\n    fun `slow native delivery preserves physical frame age instead of pretending it is fresh`() {\n        val store = TelemetryStateStore()\n        store.beginSession(77L)\n        val physicalAt = System.currentTimeMillis() - 700L\n        val delayed = JSONObject()\n            .put("event", "telemetry")\n            .put("session_id", 77L)\n            .put("live", JSONObject()\n                .put("session_id", 77L)\n                .put("rpm", 2_200)\n                .put("last_frame_at", physicalAt / 1000.0)\n                .put("last_frame_age_ms", 0))\n            .toString()\n\n        assertTrue(store.updateFromEngineEvent(delayed) != null)\n        val live = JSONObject(store.liveJson())\n        assertTrue("physical age was ${live.optLong("ageMs", -1L)} ms", live.optLong("ageMs", -1L) >= 500L)\n        assertTrue("delivery delay missing", live.optLong("deliveryDelayMs", -1L) >= 500L)\n        assertTrue("receipt itself should be fresh", live.optLong("deliveryAgeMs", Long.MAX_VALUE) < 250L)\n    }\n\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'telemetry test anchor drifted count={s.count(anchor)}')
          test.write_text(s.replace(anchor, addition + anchor, 1), encoding='utf-8')

          service = Path('app/src/main/java/com/omegas/prohub/service/TelemetryForegroundService.kt')
          s = service.read_text(encoding='utf-8')
          anchor = '    fun overlayStatusJson(): String = if (::overlay.isInitialized) overlay.statusJson().toString() else "{}"\n'
          addition = '''    fun restoreTelemetryOverlayIfAllowed() {\n        if (!::overlay.isInitialized) return\n        overlay.restoreIfAllowed()\n        updateOverlay()\n    }\n\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'overlay service anchor drifted count={s.count(anchor)}')
          service.write_text(s.replace(anchor, anchor + addition, 1), encoding='utf-8')

          activity = Path('app/src/main/java/com/omegas/prohub/MainActivity.kt')
          s = activity.read_text(encoding='utf-8')
          old = '''            service = (binder as TelemetryForegroundService.LocalBinder).service()\n            bound = true\n            refreshWebUi()\n'''
          new = '''            service = (binder as TelemetryForegroundService.LocalBinder).service()\n            bound = true\n            service?.restoreTelemetryOverlayIfAllowed()\n            refreshWebUi()\n'''
          if s.count(old) != 1:
              raise SystemExit(f'service bind anchor drifted count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''    override fun onResume() {\n        super.onResume()\n        refreshWebUi()\n    }\n'''
          new = '''    override fun onResume() {\n        super.onResume()\n        service?.restoreTelemetryOverlayIfAllowed()\n        refreshWebUi()\n    }\n'''
          if s.count(old) != 1:
              raise SystemExit(f'onResume anchor drifted count={s.count(old)}')
          activity.write_text(s.replace(old, new, 1), encoding='utf-8')

          contract = Path('tests/test_background_power_overlay_contract.py')
          s = contract.read_text(encoding='utf-8')
          anchor = 'assert "data-obd-overlay-disable" in obd\n'
          addition = '''\n# Retorno da tela de permissao deve reconciliar a intencao persistida e\n# efetivamente restaurar o overlay; apenas refrescar a WebView nao basta.\nassert "restoreTelemetryOverlayIfAllowed" in service\nassert "restoreTelemetryOverlayIfAllowed" in activity\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'overlay contract anchor drifted count={s.count(anchor)}')
          contract.write_text(s.replace(anchor, anchor + addition, 1), encoding='utf-8')
          PY

      - name: Verify focused issue 20 behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/test_background_power_overlay_contract.py
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest \
            --tests 'com.omegas.prohub.telemetry.TelemetryStateStoreTest' \
            -PomegasAbis=armeabi-v7a \
            --no-daemon --stacktrace
          python3 -B tools/run_checks.py

      - name: Commit issue 20 and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/blue-20-apply.yml
          git add -- \
            app/src/main/java/com/omegas/prohub/telemetry/TelemetryStateStore.kt \
            app/src/test/java/com/omegas/prohub/telemetry/TelemetryStateStoreTest.kt \
            app/src/main/java/com/omegas/prohub/service/TelemetryForegroundService.kt \
            app/src/main/java/com/omegas/prohub/MainActivity.kt \
            tests/test_background_power_overlay_contract.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(blue): preserve physical telemetry freshness and overlay restore #20"
          git push origin HEAD:work/omegas-blue-causal-engine
