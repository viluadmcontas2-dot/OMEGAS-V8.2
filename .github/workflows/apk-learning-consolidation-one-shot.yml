name: OMEGAS V8 APK — Learning Consolidation One Shot

on:
  push:
    branches:
      - rebuild/apk-authorized-learning-consolidation-c994bac
    paths:
      - .github/workflows/apk-learning-consolidation-one-shot.yml

permissions:
  contents: read

concurrency:
  group: omegas-v8-apk-learning-consolidation-one-shot
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  SOURCE_SHA: '228f953e065ec18c356daf65e5d9c2741b504c7f'

jobs:
  build-apk:
    name: Gerar APK da fotografia validada
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar exatamente a fotografia validada
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Preparar Java 17 com cache Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Gerar APK debug
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --build-cache \
            --parallel \
            --console=plain

      - name: Organizar entrega e hash
        run: |
          set -euo pipefail
          mkdir -p build/delivery
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          out="build/delivery/OMEGAS-V8-learning-consolidation-${SOURCE_SHA:0:7}.apk"
          cp "$apk" "$out"
          sha256sum "$out" | tee build/delivery/SHA256SUMS.txt
          printf 'source_sha=%s\n' "$SOURCE_SHA" > build/delivery/BUILD_METADATA.txt

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: OMEGAS-V8-APK-learning-consolidation-${{ env.SOURCE_SHA }}
          path: build/delivery/**
          if-no-files-found: error
          retention-days: 7
