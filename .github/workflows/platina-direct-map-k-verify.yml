name: Platina direct Map K verification

on:
  push:
    branches:
      - work/platina-direct-k-write
    paths:
      - "app/src/main/java/com/omegas/prohub/calibration/KWriteManager.kt"
      - "app/src/main/java/com/omegas/prohub/calibration/MapBatchPlan.kt"
      - "app/src/main/java/com/omegas/prohub/web/HubJavascriptBridge.kt"
      - "app/src/main/java/com/omegas/prohub/web/V7JavascriptBridge.kt"
      - "app/src/main/assets/ui/screens/map.js"
      - "app/src/main/assets/ui/core/native-api.js"
      - "app/src/test/java/com/omegas/prohub/calibration/MapBatchPlanTest.kt"
      - "tests/test_v7_map_batch_contract.py"
      - ".github/workflows/platina-direct-map-k-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Direct writer contract
        run: python3 -m unittest tests.test_v7_map_batch_contract -v
      - name: Map UI regression
        run: node --test tests/ui/curve-map-editor-coherence.test.cjs
      - name: Compile and focused JVM test
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --tests 'com.omegas.prohub.calibration.MapBatchPlanTest' --no-daemon --stacktrace
      - name: Broad software checks
        run: python3 -B tools/run_checks.py
