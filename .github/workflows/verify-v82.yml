# Verification trigger authorized by the owner's 2026-08-18 finalizing campaign.
# This workflow never assembles or uploads an APK.
# Diagnostic broad gate: publishes first useful failure line in a readable legacy status context.
# Diagnostic run marker: readable-status-v8.
name: Verify OMEGAS V8.2 pre-APK

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/v8.2-final-implementation
    paths:
      - .github/workflows/verify-v82.yml

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python verification dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify exact source
        run: |
          echo "VERIFY_COMMIT=$(git rev-parse HEAD)"
          git status --short

      - name: Structural Python contracts
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q tests 2>&1 | tee /tmp/pytest.log
          code=${PIPESTATUS[0]}
          summary=$(grep -E -m1 '(^FAILED |^E +|AssertionError|SyntaxError|ImportError|ERROR )' /tmp/pytest.log | tr '\n\r\"' '   ' | cut -c1-72)
          if [ -z "$summary" ]; then summary=$(tail -n 1 /tmp/pytest.log | tr '\n\r\"' '   ' | cut -c1-72); fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          exit 0

      - name: JVM unit tests
        id: jvm
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee /tmp/jvm.log
          code=${PIPESTATUS[0]}
          summary=$(grep -E -m1 '^e: file:' /tmp/jvm.log | sed -E 's#^e: file://.*/([^/]+):#e: \1:#' | tr '\n\r\"' '   ' | cut -c1-72)
          if [ -z "$summary" ]; then summary=$(grep -E -m1 '(Compilation error|FAILED|FAILURE:|> Task .* FAILED|error:)' /tmp/jvm.log | tr '\n\r\"' '   ' | cut -c1-72); fi
          if [ -z "$summary" ]; then summary=$(tail -n 1 /tmp/jvm.log | tr '\n\r\"' '   ' | cut -c1-72); fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Android lint
        id: lint
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace :app:lintDebug 2>&1 | tee /tmp/lint.log
          code=${PIPESTATUS[0]}
          summary=$(grep -E -m1 '^e: file:' /tmp/lint.log | sed -E 's#^e: file://.*/([^/]+):#e: \1:#' | tr '\n\r\"' '   ' | cut -c1-72)
          if [ -z "$summary" ]; then summary=$(grep -E -m1 '(Compilation error|FAILED|FAILURE:|> Task .* FAILED|[0-9]+ errors?,| Error: )' /tmp/lint.log | tr '\n\r\"' '   ' | cut -c1-72); fi
          if [ -z "$summary" ]; then summary=$(tail -n 1 /tmp/lint.log | tr '\n\r\"' '   ' | cut -c1-72); fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish verification statuses
        env:
          GH_TOKEN: ${{ github.token }}
          PYTEST_CODE: ${{ steps.pytest.outputs.exit_code }}
          PYTEST_SUMMARY: ${{ steps.pytest.outputs.summary }}
          JVM_CODE: ${{ steps.jvm.outputs.exit_code }}
          JVM_SUMMARY: ${{ steps.jvm.outputs.summary }}
          LINT_CODE: ${{ steps.lint.outputs.exit_code }}
          LINT_SUMMARY: ${{ steps.lint.outputs.summary }}
        shell: bash
        run: |
          publish_status() {
            stage="$1"; code="$2"; summary="$3"
            if [ "$code" = "0" ]; then
              state="success"; context="v8.2/${stage}"; description="passed"
            else
              state="failure"; context="v8.2/${stage}/FAIL ${summary}"; description="$summary"
            fi
            payload=$(jq -nc --arg state "$state" --arg context "$context" --arg description "$description" '{state:$state,context:$context,description:$description}')
            curl --fail-with-body -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$payload"
          }
          publish_status "pytest" "$PYTEST_CODE" "$PYTEST_SUMMARY"
          publish_status "jvm" "$JVM_CODE" "$JVM_SUMMARY"
          publish_status "lint" "$LINT_CODE" "$LINT_SUMMARY"
          if [ "$PYTEST_CODE" = "0" ] && [ "$JVM_CODE" = "0" ] && [ "$LINT_CODE" = "0" ]; then aggregate="success"; desc="pytest + JVM unit tests + Android lint passed"; else aggregate="failure"; desc="one or more pre-APK verification stages failed"; fi
          payload=$(jq -nc --arg state "$aggregate" --arg context "v8.2/preapk-verify" --arg description "$desc" '{state:$state,context:$context,description:$description}')
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
          [ "$aggregate" = "success" ]
