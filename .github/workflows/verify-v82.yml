# Verification trigger authorized by the owner's 2026-08-18 finalizing campaign.
# This workflow never assembles or uploads an APK.
# G3A broad gate trigger: 2026-08-18.
name: Verify OMEGAS V8.2 pre-APK

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/v8.2-final-implementation
    paths:
      - .github/workflows/verify-v82.yml

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify exact source
        run: |
          echo "VERIFY_COMMIT=$(git rev-parse HEAD)"
          git status --short

      - name: Structural Python contracts
        run: python3 -m pytest -q tests

      - name: JVM unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Publish successful verification status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"v8.2/preapk-verify","description":"pytest + JVM unit tests + Android lint passed"}'

      - name: Publish failed verification status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"v8.2/preapk-verify","description":"pre-APK verification failed; inspect workflow logs"}'
