# Verification trigger authorized by the owner's 2026-08-18 finalizing campaign.
# This workflow never assembles or uploads an APK.
# G3A broad gate trigger: 2026-08-18.
name: Verify OMEGAS V8.2 pre-APK

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/v8.2-final-implementation
    paths:
      - .github/workflows/verify-v82.yml

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify exact source
        run: |
          echo "VERIFY_COMMIT=$(git rev-parse HEAD)"
          git status --short

      - name: Structural Python contracts
        id: pytest
        continue-on-error: true
        run: python3 -m pytest -q tests

      - name: JVM unit tests
        id: jvm
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Android lint
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Publish verification statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          JVM_OUTCOME: ${{ steps.jvm.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          publish_status() {
            context="$1"
            outcome="$2"
            description="$3"
            if [ "$outcome" = "success" ]; then state="success"; else state="failure"; fi
            curl --fail-with-body -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "{\"state\":\"${state}\",\"context\":\"${context}\",\"description\":\"${description}\"}"
          }
          publish_status "v8.2/pytest" "$PYTEST_OUTCOME" "structural Python contracts"
          publish_status "v8.2/jvm" "$JVM_OUTCOME" "JVM unit tests"
          publish_status "v8.2/lint" "$LINT_OUTCOME" "Android lint"

      - name: Enforce aggregate verification result
        if: always()
        env:
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          JVM_OUTCOME: ${{ steps.jvm.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PYTEST_OUTCOME" = "success" ] && [ "$JVM_OUTCOME" = "success" ] && [ "$LINT_OUTCOME" = "success" ]; then
            state="success"
            description="pytest + JVM unit tests + Android lint passed"
          else
            state="failure"
            description="one or more pre-APK verification stages failed"
          fi
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"v8.2/preapk-verify\",\"description\":\"${description}\"}"
          [ "$state" = "success" ]
