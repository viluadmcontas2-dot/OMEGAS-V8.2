name: OmegasVerde historical LEVELS render RED

on:
  push:
    branches: [OmegasVerde]
    paths:
      - '.github/workflows/verde-historical-levels-red.yml'
      - 'app/src/androidTest/java/com/omegas/prohub/DashboardLevelsRenderTest.kt'

permissions:
  contents: read

jobs:
  historical-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore exact pre-LEVELS Dashboard asset
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin eeefaaa4d8371e3c4c6cf1260f1ee4b65e836618
          git show eeefaaa4d8371e3c4c6cf1260f1ee4b65e836618:app/src/main/assets/ui/screens/dashboard.js > app/src/main/assets/ui/screens/dashboard.js
          ! grep -q 'LEVELS RAW' app/src/main/assets/ui/screens/dashboard.js
      - name: Render historical RED at 1280x720
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-build: 15917651
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          script: |
            set -euo pipefail
            chmod +x gradlew
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
            adb shell wm size 1280x720
            adb shell wm density 160
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p historical-levels-evidence
            adb shell am instrument -w -r \
              -e class 'com.omegas.prohub.DashboardLevelsRenderTest#historicalPreLevelsDashboardOmitsRawLevels' \
              com.omegas.v7.test.test/androidx.test.runner.AndroidJUnitRunner \
              > historical-levels-evidence/instrumentation.txt 2>&1
            cat historical-levels-evidence/instrumentation.txt
            grep -q 'OK (1 test)' historical-levels-evidence/instrumentation.txt
            ! grep -q 'FAILURES!!!' historical-levels-evidence/instrumentation.txt
            adb pull /sdcard/Android/data/com.omegas.v7.test/files/omegas-evidence/. historical-levels-evidence/ || true
            adb exec-out screencap -p > historical-levels-evidence/post.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-levels-render-red
          path: historical-levels-evidence/
          retention-days: 7
          if-no-files-found: error
