name: VIT-85 Step 123 exact-SHA gate

on:
  pull_request:
    branches:
      - feature/phase06-pragmatic-equivalence-20260821

permissions:
  contents: read

jobs:
  step123-final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: 6cd2b3ba31761d78d838896367fa626d76a188a3
    steps:
      - name: Checkout frozen candidate
        uses: actions/checkout@v4
        with:
          ref: 6cd2b3ba31761d78d838896367fa626d76a188a3
          fetch-depth: 1
      - name: Assert exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "candidate=$CANDIDATE_SHA"
          echo "actual=$actual"
          test "$actual" = "$CANDIDATE_SHA"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run full Android JUnit suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Run Phase 06 offline oracle unit suite
        shell: bash
        run: |
          set -euo pipefail
          cd tools/phase06
          python3 -m unittest -v test_equivalence_oracle.py
