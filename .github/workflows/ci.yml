name: OMEGAS VERDE CI

on:
  push:
    branches: [ OmegasVerde ]
  pull_request:
    branches: [ OmegasVerde ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew
      - name: Learning consolidation contract
        run: python -m unittest discover -s tests -p 'test_learning_consolidation_contract.py'
      - run: ./gradlew testDebugUnitTest
      - run: ./gradlew assembleDebug
      - name: Hash APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omegas-verde-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
