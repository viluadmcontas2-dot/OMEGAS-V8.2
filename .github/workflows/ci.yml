name: OMEGAS VERMELHO CI

on:
  push:
    branches: [ OmegasVermelho, 'claude/carregar-sessao-r7j85r' ]
  pull_request:
    branches: [ OmegasVermelho ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui_chromium:
    name: UI Chromium e ECU simulada
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Identidade da fonte
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Cache do Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1
      - name: Instalar navegador dos testes
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "${{ runner.temp }}/omegas-ui-test" playwright@1.56.1
          "${{ runner.temp }}/omegas-ui-test/node_modules/.bin/playwright" install chromium
      - name: Testar fluxo real de Ferramentas com toque e ECU simulada
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="${{ runner.temp }}/omegas-ui-test/node_modules" node --test --test-concurrency=1 \
            tests/ui/ferramentas-webview-regression.test.cjs \
            tests/ui/anti-apagao-sem-snapshot.test.cjs \
            tests/ui/ux-fluxo-toque.test.cjs \
            tests/ui/campos-editaveis.test.cjs \
            tests/ui/ferramentas-sem-rolagem.test.cjs \
            2>&1 | tee "${{ runner.temp }}/w6-ferramentas.log"
      - name: Diagnóstico do navegador
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-ui-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/w6-ferramentas.log
            docs/evidence/img/
          if-no-files-found: warn
          retention-days: 14

  fast_contracts:
    name: Contratos Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Testar contratos
        shell: bash
        run: python3 -B tools/run_checks.py
      - name: Diagnóstico de contratos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-contracts-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/w6-contracts.log
          if-no-files-found: warn
          retention-days: 14

  android_checks:
    name: Android unitário e lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Identidade da fonte
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew
      - name: JVM unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest
      - name: Android lint
        shell: bash
        run: ./gradlew lintDebug
      - name: Android failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-android-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/w6-unit-tests.log
            ${{ runner.temp }}/w6-lint.log
            app/build/reports/
            app/build/test-results/
            build/reports/
          if-no-files-found: warn
          retention-days: 14

  grafo:
    # Grafo de conhecimento do código (graphify update: determinístico, sem LLM, sem chave de API) + mapa de fontes em dia.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet graphifyy
      - name: Reconstruir grafo
        run: graphify update . 2>&1 | tail -5
      - name: Ligar documentos, evidências e código (determinístico)
        run: python3 -B tools/grafo_conhecimento.py
      - name: Mapa de fontes em dia
        run: python3 -B tools/mapa_de_fontes.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: omegas-grafo
          path: |
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
            docs/mapa-de-fontes/
          retention-days: 30

  build_and_test:
    # Preserva o nome do status check obrigatório. Falha se QUALQUER frente falhar ou não rodar.
    name: build_and_test
    needs: [ui_chromium, fast_contracts, android_checks, grafo]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Integração de todas as provas no mesmo SHA
        env:
          UI: ${{ needs.ui_chromium.result }}
          CONTRACTS: ${{ needs.fast_contracts.result }}
          ANDROID: ${{ needs.android_checks.result }}
          GRAPH: ${{ needs.grafo.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'SOURCE_SHA=%s\nUI=%s\nCONTRACTS=%s\nANDROID=%s\nGRAPH=%s\n' "$GITHUB_SHA" "$UI" "$CONTRACTS" "$ANDROID" "$GRAPH"
          test "$UI" = success
          test "$CONTRACTS" = success
          test "$ANDROID" = success
          test "$GRAPH" = success

  disparar_apk_com_autorizacao:
    # Exceção única: pedido explícito do proprietário, depois de ambos os checks verdes.
    # Este job NÃO compila nem publica APK; solicita o workflow manual separado.
    needs: [build_and_test]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/claude/carregar-sessao-r7j85r' && contains(github.event.head_commit.message, '[apk-autorizado-20261018]') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Solicitar o APK manual depois da CI verde
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run verde-apk-now.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f build_apk=true
