name: OMEGAS CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript e navegador
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Identidade da fonte
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Cache do Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1
      - name: Instalar navegador dos testes
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "${{ runner.temp }}/omegas-ui-test" playwright@1.56.1
          "${{ runner.temp }}/omegas-ui-test/node_modules/.bin/playwright" install chromium
      - name: Testar JavaScript e navegador
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="${{ runner.temp }}/omegas-ui-test/node_modules"
          python3 - <<'CHECKS' 2>&1 | tee "${{ runner.temp }}/ci-javascript.log"
          from pathlib import Path
          import subprocess
          tests = sorted(Path("tests/ui").glob("*.test.cjs"))
          assert tests, "Nenhum teste JavaScript descoberto"
          for path in tests:
              if "@requires-gradle-test-results" not in path.read_text():
                  subprocess.run(["node", "--test", str(path)], check=True)
          CHECKS
      - name: Capturas da interface testada (sem APK)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ferramental-ux-${{ github.sha }}
          path: |
            docs/evidence/img/ux-*.png
            docs/evidence/img/e2e-navegacao-*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Diagnóstico do navegador
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-ui-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ci-javascript.log
            docs/evidence/img/
          if-no-files-found: warn
          retention-days: 14

  python:
    name: Contratos Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Testar contratos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CHECKS' 2>&1 | tee "${{ runner.temp }}/ci-python.log"
          from pathlib import Path
          import subprocess, sys
          tests = sorted(Path("tests").glob("test_*.py"))
          assert tests, "Nenhum contrato Python descoberto"
          for path in tests:
              subprocess.run([sys.executable, "-B", str(path)], check=True)
          CHECKS
      - name: Diagnóstico de contratos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-contracts-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-python.log
          if-no-files-found: warn
          retention-days: 14

  kotlin:
    name: Kotlin e contratos dependentes da JVM
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Identidade da fonte
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew
      - name: JVM unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest 2>&1 | tee "${{ runner.temp }}/ci-kotlin.log"
      - name: Contratos que exigem resultados JVM
        shell: bash
        run: |
          python3 - <<'CHECKS'
          from pathlib import Path
          import subprocess
          for path in sorted(Path("tests/ui").glob("*.test.cjs")):
              if "@requires-gradle-test-results" in path.read_text():
                  subprocess.run(["node", "--test", str(path)], check=True)
          CHECKS
      - name: Android failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-android-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ci-kotlin.log
            app/build/reports/
            app/build/test-results/
            build/reports/
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Android lint
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - run: sh ./gradlew lintDebug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-lint-failure-${{ github.run_id }}
          path: app/build/reports/

  grafo:
    # Grafo de conhecimento do código (graphify update: determinístico, sem LLM, sem chave de API) + mapa de fontes em dia.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet graphifyy
      - name: Reconstruir grafo
        shell: bash
        run: |
          set -euo pipefail
          graphify update . 2>&1 | tail -5
      - name: Ligar documentos, evidências e código (determinístico)
        run: python3 -B tools/grafo_conhecimento.py
      - name: Grafo de produção em dia e sem elo essencial quebrado
        run: python3 -B tools/grafo_producao.py --check
      - name: Cobertura da engenharia reversa em dia
        run: python3 -B tools/progbase/cobertura_re.py --check
      - name: Integridade das evidências e do grafo
        run: python3 -B tools/auditoria.py --check
      - name: Mapa de fontes em dia
        run: python3 -B tools/mapa_de_fontes.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omegas-grafo
          path: |
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
            docs/mapa-de-fontes/
            docs/grafo/
            docs/handoff/AUDITORIA.json
          retention-days: 30

  build_and_test:
    # Preserva o nome do status check obrigatório. Falha se QUALQUER frente falhar ou não rodar.
    name: build_and_test
    needs: [javascript, python, kotlin, lint, grafo]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Integração de todas as provas no mesmo SHA
        env:
          UI: ${{ needs.javascript.result }}
          CONTRACTS: ${{ needs.python.result }}
          ANDROID: ${{ needs.kotlin.result }}
          LINT: ${{ needs.lint.result }}
          GRAPH: ${{ needs.grafo.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'SOURCE_SHA=%s\nUI=%s\nCONTRACTS=%s\nANDROID=%s\nGRAPH=%s\n' "$GITHUB_SHA" "$UI" "$CONTRACTS" "$ANDROID" "$GRAPH"
          test "$UI" = success
          test "$CONTRACTS" = success
          test "$ANDROID" = success
          test "$GRAPH" = success
          test "$LINT" = success
