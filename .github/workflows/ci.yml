name: OMEGAS VERDE CI

on:
  push:
    branches: [ OmegasVerde ]
  pull_request:
    branches: [ OmegasVerde ]
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Gerar APK após autorização explícita do proprietário'
        required: false
        default: false
        type: boolean

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew
      - name: Fast contracts
        run: python3 -B tools/run_checks.py
      - name: JVM unit tests
        run: ./gradlew testDebugUnitTest
      - name: Android lint
        run: ./gradlew lintDebug
      - name: Build APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk == true }}
        run: ./gradlew assembleDebug
      - name: Hash APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk == true }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
      - name: Publish APK artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk == true }}
        uses: actions/upload-artifact@v4
        with:
          name: omegas-verde-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
