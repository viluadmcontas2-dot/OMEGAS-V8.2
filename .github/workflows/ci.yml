name: OMEGAS PLATINA CI

on:
  push:
    branches: [ OmegasDiamante, OmegasPlatina ]
  pull_request:
    branches: [ OmegasDiamante, OmegasPlatina ]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$GITHUB_SHA"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew
      - name: Fast contracts
        run: python3 -B tools/run_checks.py
      - name: JVM unit tests
        run: ./gradlew testDebugUnitTest
      - name: Relatorio do replay do apagamento automatico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-apagamento-automatico
          path: app/build/test-results/testDebugUnitTest/TEST-com.omegas.prohub.autocal.AutoIdleRealSessionReplayTest.xml
          if-no-files-found: ignore
      - name: Android lint
        run: ./gradlew lintDebug
