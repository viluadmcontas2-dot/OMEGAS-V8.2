name: OMEGAS VERMELHO CI

on:
  push:
    branches: [ OmegasVermelho ]
  pull_request:
    branches: [ OmegasVermelho ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prove source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$GITHUB_SHA"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew
      - name: Fast contracts
        shell: bash
        run: python3 -B tools/run_checks.py 2>&1 | tee "${{ runner.temp }}/w6-contracts.log"
      - name: JVM unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest 2>&1 | tee "${{ runner.temp }}/w6-unit-tests.log"
      - name: Android lint
        shell: bash
        run: ./gradlew lintDebug 2>&1 | tee "${{ runner.temp }}/w6-lint.log"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/w6-*.log
            app/build/reports/
            app/build/test-results/
            build/reports/
          if-no-files-found: warn
          retention-days: 14
