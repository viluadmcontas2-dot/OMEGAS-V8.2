name: OMEGAS PLATINA CI

on:
  push:
    branches: [ OmegasDiamante, OmegasPlatina, OMEGASCINZA ]
  pull_request:
    branches: [ OmegasDiamante, OmegasPlatina, OMEGASCINZA ]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$GITHUB_SHA"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew
      - name: Fast contracts
        run: python3 -B tools/run_checks.py
      - name: Trava reset-nunca-pausa-aprendizado (regra 14, nao remover)
        run: |
          python3 -B tests/test_reset_nunca_pausa_aprendizado.py
          ./gradlew testDebugUnitTest --tests '*ResetNuncaPausaAprendizadoTest'
      - name: Trava curva-salvamento-so-manual (regra 15, nao remover)
        run: |
          python3 -B tests/test_curva_salvamento_so_manual.py
          python3 -B tools/wiring/run_ui_mutants.py --ci --only curva-autosave,curva-backup-ao-gravar,curva-backup-ao-desfazer,curva-nome-generico,curva-pasta-errada,curva-lote-publica-arquivo,curva-prewrite-vira-manual --min-kill 1.0
          ./gradlew testDebugUnitTest --tests '*KFactorCurveFileNameTest'
      - name: Trava apagar-manual-mantem-limpeza (regra 17, nao remover)
        run: |
          node --test tests/ui/autocal-apagar-manual-mantem-limpeza.test.cjs
          python3 -B tools/wiring/run_ui_mutants.py --ci --only apagar-manual-desarma-limpeza --min-kill 1.0
          ./gradlew testDebugUnitTest --tests '*AutoCalManualDeleteKeepsAutoCleanupTest'
      - name: JVM unit tests
        run: ./gradlew testDebugUnitTest
      - name: AutoCal revisoes ponta a ponta no Chrome (OMEGASCINZA)
        if: github.ref == 'refs/heads/OMEGASCINZA'
        env:
          OMEGAS_REVISION_STRESS_OUT: tests/ui/__teia__/out-revision
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/omegas-revision-pw" playwright@1.64.0 --ignore-scripts --no-save --no-package-lock --no-audit --no-fund
          export NODE_PATH="$RUNNER_TEMP/omegas-revision-pw/node_modules"
          export OMEGAS_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$OMEGAS_CHROMIUM" && test -x "$OMEGAS_CHROMIUM" || { echo "::error::Chromium ausente; teste de latencia NAO pode ser ignorado"; exit 1; }
          python3 tests/ui/render/prep.py /tmp/omegas-render-data.json
          node tools/ui_stress/autocal-transport-causality.cjs
          export OMEGAS_PETROL_REREAD_OUT="$OMEGAS_REVISION_STRESS_OUT/petrol-reread"
          node --test tests/ui/autocal-reread-petrol-visual.test.cjs
      - name: Capturas AutoCal revisoes (OMEGASCINZA)
        if: always() && github.ref == 'refs/heads/OMEGASCINZA'
        uses: actions/upload-artifact@v4
        with:
          name: omegascinza-revisoes-autocal
          path: tests/ui/__teia__/out-revision
          if-no-files-found: ignore
      - name: Simulacao intensa do AutoCal em Chromium (despacho manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          OMEGAS_TEIA_OUT: tests/ui/__teia__/out
          OMEGAS_STRESS_OUT: tests/ui/__teia__/out-stress
          OMEGAS_STRESS_EVENTS: '4000'
          OMEGAS_STRESS_DELAY_MS: '7'
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/omegas-pw" playwright@1.64.0 --ignore-scripts --no-save --no-package-lock --no-audit --no-fund
          export NODE_PATH="$RUNNER_TEMP/omegas-pw/node_modules"
          export OMEGAS_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$OMEGAS_CHROMIUM" && test -x "$OMEGAS_CHROMIUM" || { echo "::error::Chromium ausente: NAO ignorar testes visuais"; exit 1; }
          node -e "const l=require('./tests/ui/render/lib.js'); const p=l.playwright(); if(!p||!l.chromiumPath(p.chromium)) {console.error('Playwright/Chromium nao encontrado'); process.exit(3)}"
          python3 tests/ui/render/prep.py /tmp/omegas-render-data.json
          node --test tests/ui/autocal-teia.test.cjs
          node tools/ui_stress/autocal-browser-stress.cjs
          node tools/ui_studio/studio-smoke.cjs
      - name: Evidencia da oficina visual OMEGASCINZA (manual)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: omegascinza-oficina-visual
          path: tools/ui_studio/studio-smoke.png
          if-no-files-found: ignore
      - name: Evidencias da simulacao visual intensa (manual)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: autocal-estresse-4000
          path: tests/ui/__teia__/out-stress
          if-no-files-found: error
      - name: Relatorio do replay do apagamento automatico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-apagamento-automatico
          path: app/build/test-results/testDebugUnitTest/TEST-com.omegas.prohub.autocal.AutoIdleRealSessionReplayTest.xml
          if-no-files-found: ignore
      - name: Relatorio do replay do Refino (qual guarda bloqueia a proposta)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-refino-proposta
          path: app/build/test-results/testDebugUnitTest/TEST-com.omegas.prohub.equivalence.ProposalReplayReportTest.xml
          if-no-files-found: ignore
      - name: Sessao ficticia (JSON dos 5 momentos para a prova visual)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sessao-ficticia
          path: app/build/sessao-ficticia
      - name: Teia do AutoCal (folha de contato, log de comandos, capturas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teia-autocal
          path: tests/ui/__teia__/out
          if-no-files-found: ignore
      - name: Android lint
        run: ./gradlew lintDebug

      - name: Build candidate APK only after every CI gate is green (OMEGASCINZA)
        if: success() && github.ref == 'refs/heads/OMEGASCINZA' && github.event_name != 'pull_request'
        run: ./gradlew assembleDebug
      - name: Prove APK source and checksum
        if: success() && github.ref == 'refs/heads/OMEGASCINZA' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs/apk/provenance
          printf 'SOURCE_SHA=%s\nSOURCE_TREE=%s\n' "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" | tee app/build/outputs/apk/provenance/identity.txt
          sha256sum app/build/outputs/apk/debug/*.apk | tee app/build/outputs/apk/provenance/SHA256SUMS.txt
      - name: APK OMEGASCINZA verified artifact
        if: success() && github.ref == 'refs/heads/OMEGASCINZA' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: omegascinza-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/provenance/*
          if-no-files-found: error
      - name: JVM failures and receipts (including when tests fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omegascinza-jvm-receipts-${{ github.sha }}
          path: app/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: ignore

