name: OMEGAS VERDE CI

on:
  push:
    branches: [ OmegasVerde ]
  pull_request:
    branches: [ OmegasVerde ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest
      - run: ./gradlew assembleDebug
