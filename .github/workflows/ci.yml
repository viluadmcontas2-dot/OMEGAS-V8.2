name: OMEGAS VERMELHO CI

on:
  push:
    branches: [ OmegasVermelho, 'claude/carregar-sessao-r7j85r' ]
  pull_request:
    branches: [ OmegasVermelho ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prove source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$GITHUB_SHA"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew
      - name: Regressão Ferramentas (Chromium + toque)
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "${{ runner.temp }}/omegas-ui-test" playwright@1.56.1
          "${{ runner.temp }}/omegas-ui-test/node_modules/.bin/playwright" install chromium
          NODE_PATH="${{ runner.temp }}/omegas-ui-test/node_modules" node --test tests/ui/ferramentas-webview-regression.test.cjs 2>&1 | tee "${{ runner.temp }}/w6-ferramentas.log"
      - name: Fast contracts
        shell: bash
        run: python3 -B tools/run_checks.py 2>&1 | tee "${{ runner.temp }}/w6-contracts.log"
      - name: JVM unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest 2>&1 | tee "${{ runner.temp }}/w6-unit-tests.log"
      - name: Android lint
        shell: bash
        run: ./gradlew lintDebug 2>&1 | tee "${{ runner.temp }}/w6-lint.log"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/w6-*.log
            app/build/reports/
            app/build/test-results/
            build/reports/
          if-no-files-found: warn
          retention-days: 14

  grafo:
    # Grafo de conhecimento do código (graphify update: determinístico, sem LLM, sem chave de API) + mapa de fontes em dia.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet graphifyy
      - name: Reconstruir grafo
        run: graphify update . 2>&1 | tail -5
      - name: Ligar documentos, evidências e código (determinístico)
        run: python3 -B tools/grafo_conhecimento.py
      - name: Mapa de fontes em dia
        run: python3 -B tools/mapa_de_fontes.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: omegas-grafo
          path: |
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
            docs/mapa-de-fontes/
          retention-days: 30

  disparar_apk_com_autorizacao:
    # Exceção única: pedido explícito do proprietário, depois de ambos os checks verdes.
    # Este job NÃO compila nem publica APK; solicita o workflow manual separado.
    needs: [build_and_test, grafo]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/claude/carregar-sessao-r7j85r' && contains(github.event.head_commit.message, '[apk-autorizado-20261018]') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Solicitar o APK manual depois da CI verde
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run verde-apk-now.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f build_apk=true
