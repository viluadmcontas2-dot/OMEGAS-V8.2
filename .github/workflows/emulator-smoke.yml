name: OMEGAS Emulator Smoke

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: API Android do emulador
        required: true
        default: '35'
        type: choice
        options:
          - '35'
          - '34'
          - '30'

permissions:
  contents: read

concurrency:
  group: emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    name: Instalar, abrir e vigiar crashes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar e gerar APK
        env:
          OMEGAS_SOURCE_SHA: ${{ github.sha }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Executar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
            test -n "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.omegas.prohub.test || true
            adb shell monkey -p com.omegas.prohub.test -c android.intent.category.LAUNCHER 1
            sleep 12
            adb shell dumpsys activity activities | grep -q 'com.omegas.prohub.test/.MainActivity'
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml build/window.xml
            adb exec-out screencap -p > build/emulator-home.png
            adb logcat -d > build/emulator-logcat.txt
            if grep -E 'FATAL EXCEPTION|AndroidRuntime.*Process: com\.omegas\.prohub\.test|ForegroundServiceDidNotStopInTimeException' build/emulator-logcat.txt; then
              echo 'Crash ou falha grave detectada no emulador'
              exit 1
            fi
      - name: Publicar evidências do emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence-${{ github.sha }}-api${{ inputs.api_level }}
          path: |
            build/emulator-home.png
            build/emulator-logcat.txt
            build/window.xml
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
