name: OMEGAS APK one-time Drive delivery
on:
  push:
    branches: ['claude/carregar-sessao-r7j85r']
    paths: ['.github/workflows/omegas-apk-once-20261019.yml']
permissions:
  contents: read
env:
  PRODUCT_SHA: d4db2ee5c194543d1e3d2b4b6c89ef9cf30ee784
jobs:
  build:
    if: ${{ github.event.head_commit.message == 'build(apk) one-time approved source d4db2ee5 for Drive' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
      - name: Verify immutable product source
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1
      - name: Browser for UI tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "${{ runner.temp }}/omegas-ui-test" playwright@1.56.1
          "${{ runner.temp }}/omegas-ui-test/node_modules/.bin/playwright" install chromium
      - name: Prove CI for same immutable product SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED="$(gh api repos/viluadmcontas2-dot/OMEGAS-V8.2/actions/runs/39259211578 --jq '[.head_sha,.conclusion] | join(" ")')"
          echo "CI_PROOF=$VERIFIED"
          test "$VERIFIED" = "$PRODUCT_SHA success"
      - name: Android recheck and assemble APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug -PomegasAbis=arm64-v8a --no-daemon --stacktrace 2>&1 | tee "${{ runner.temp }}/apk-gradle.log"
      - name: Hash and package APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" > /dev/null
          mkdir -p build/apk build/evidence
          cp "$APK" "build/apk/OMEGAS-d4db2ee5c194.apk"
          {
            echo "OMEGAS_APK=PASS"
            echo "SOURCE_SHA=$(git rev-parse HEAD)"
            echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"
            echo "APK_BYTES=$(stat -c %s "$APK")"
            echo "APK_ZIP_INTEGRITY=PASS"
            echo "PHYSICAL_INSTALL_NOT_YET_CLAIMED=true"
          } | tee build/evidence/omegas-apk-evidence.txt
      - name: Publish immutable tested APK
        uses: actions/upload-artifact@v4
        with:
          name: omegas-apk-d4db2ee5c194
          path: |
            build/apk/OMEGAS-d4db2ee5c194.apk
            build/evidence/omegas-apk-evidence.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-once-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/apk-*.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
