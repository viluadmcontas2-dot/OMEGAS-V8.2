name: OMEGAS Blue final cleanup apply

on:
  push:
    branches:
      - work/omegas-blue-causal-engine
    paths:
      - scripts/blue_final_cleanup.py
      - .github/workflows/blue-converge-apply.yml

permissions:
  contents: write

concurrency:
  group: omegas-blue-final-cleanup
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: work/omegas-blue-causal-engine
          fetch-depth: 0
      - name: Apply final clean architecture cut
        run: python3 scripts/blue_final_cleanup.py
      - name: Commit cleanup if changed
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No cleanup changes needed"
            exit 0
          fi
          git config user.name "omegas-blue-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor(blue): remove parallel decision residues"
          git push origin HEAD:work/omegas-blue-causal-engine
