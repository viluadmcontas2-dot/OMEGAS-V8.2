name: OMEGAS Blue remote convergence apply

on:
  push:
    branches:
      - work/omegas-blue-causal-engine
    paths:
      - scripts/blue_runtime_converge.py
      - .github/workflows/blue-converge-apply.yml

permissions:
  contents: write

concurrency:
  group: omegas-blue-convergence-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: work/omegas-blue-causal-engine
          fetch-depth: 0
      - name: Apply deterministic convergence patch
        run: python3 scripts/blue_runtime_converge.py
      - name: Commit implementation if changed
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No convergence changes needed"
            exit 0
          fi
          git config user.name "omegas-blue-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(blue): converge sessions and remove stale legacy tests"
          git push origin HEAD:work/omegas-blue-causal-engine
