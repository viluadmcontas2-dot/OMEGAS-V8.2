name: OMEGAS V7 Android

on:
  workflow_dispatch:
  push:
    branches: [main, 'migration/**', 'fix/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: omegas-v7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
  OMEGAS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  clean-ui-contract:
    name: Fluxo real da interface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar fonte
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Testar clique, revisão e lote
        run: python -B tools/run_checks.py
      - name: Verificar sintaxe da interface ativa
        run: |
          set -euo pipefail
          for script in app/src/main/assets/ui/*.js; do node --check "$script"; done
          git diff --check
      - name: Publicar relatório do contrato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-ui-contract-${{ env.OMEGAS_SOURCE_SHA }}
          path: |
            tests/**
            docs/ARCHITECTURE.md
          if-no-files-found: error
          retention-days: 14

  android:
    name: Testar e gerar APK
    needs: clean-ui-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Baixar fonte
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Preparar Gradle
        run: chmod +x gradlew
      - name: Testar núcleo, lint e compilar
        run: |
          set -euo pipefail
          mkdir -p build/reports
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug \
            --no-daemon --stacktrace --console=plain 2>&1 | tee build/reports/gradle-build.log
      - name: Organizar APK
        run: |
          set -euo pipefail
          mkdir -p build/delivery
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" "build/delivery/OMEGAS-V7-TEST-${OMEGAS_SOURCE_SHA:0:7}.apk"
          sha256sum build/delivery/*.apk > build/delivery/SHA256SUMS.txt
      - name: Publicar APK e relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OMEGAS-V7-APK-${{ env.OMEGAS_SOURCE_SHA }}
          path: |
            build/delivery/**
            build/reports/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
