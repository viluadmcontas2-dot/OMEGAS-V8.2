name: Exportação temporária do grafo Aura

on:
  push:
    branches:
      - claude/omega-aura
    paths:
      - '.github/workflows/aura-grafo-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    name: Regenerar e publicar somente artefatos do grafo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: RED já registrado; gerar, conferir e testar
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/grafo_producao.py
          python3 -B tools/grafo_producao.py --check
          python3 -B tests/test_grafo_producao.py
          git diff --check
      - name: Publicar somente os dois artefatos, sem force push
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- docs/grafo/producao.json docs/grafo/PRODUCAO.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/grafo/producao.json docs/grafo/PRODUCAO.md
            git commit -m "fix(grafo): regenerar artefatos de produção"
            git push origin HEAD:refs/heads/claude/omega-aura
          fi
      - name: Exportar os dois artefatos para auditoria
        uses: actions/upload-artifact@v4
        with:
          name: aura-grafo-gerado-${{ github.sha }}
          path: |
            docs/grafo/producao.json
            docs/grafo/PRODUCAO.md
          if-no-files-found: error
          retention-days: 3
