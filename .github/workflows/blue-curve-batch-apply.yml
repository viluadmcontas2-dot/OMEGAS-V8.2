name: Blue curve batch apply

on:
  push:
    branches:
      - work/omegas-blue-causal-engine

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: rearm curve batch applicator' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: work/omegas-blue-causal-engine
          fetch-depth: 0
      - name: Apply batch-edit production change
        run: |
          set -euo pipefail
          python3 -B tools/one_shot_curve_batch.py
          node --test tests/ui/curve-batch-edit.test.cjs
      - name: Commit production change
        run: |
          set -euo pipefail
          git config user.name 'omegas-blue-bot'
          git config user.email 'omegas-blue-bot@users.noreply.github.com'
          git add app/src/main/assets/ui/screens/curve.js app/src/main/assets/ui/index.html app/src/main/assets/ui/styles-witness-multimedia.css
          git diff --cached --check
          git commit -m 'feat(curve): batch select and edit points'
          git push origin HEAD:work/omegas-blue-causal-engine
