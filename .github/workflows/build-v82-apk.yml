# One-shot push trigger is restricted to this workflow file; ordinary source commits do not build.
# Retry 4 validates the native-anchor boundary fix before the full gate.
name: Build OMEGAS V8.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - work/v8.2-clean
    paths:
      - .github/workflows/build-v82-apk.yml

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify source commit and Gradle target
        run: |
          echo "BUILD_COMMIT=$(git rev-parse HEAD)"
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties
          git status --short

      - name: Focused native-anchor regressions
        run: >-
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
          --tests com.omegas.prohub.learning.NativeAutoCalAnchorCorrelatorTest
          --tests com.omegas.prohub.learning.NativeLearningAnchorTest

      - name: JVM unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Generate SHA-256 receipt
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK" | tee OMEGAS-V8.2-APK-SHA256.txt
          printf 'BUILD_COMMIT=%s\n' "$(git rev-parse HEAD)" | tee OMEGAS-V8.2-BUILD-RECEIPT.txt
          printf 'APK=%s\n' "$APK" | tee -a OMEGAS-V8.2-BUILD-RECEIPT.txt
          cat OMEGAS-V8.2-APK-SHA256.txt | tee -a OMEGAS-V8.2-BUILD-RECEIPT.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMEGAS-V8.2-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            OMEGAS-V8.2-APK-SHA256.txt
            OMEGAS-V8.2-BUILD-RECEIPT.txt
          if-no-files-found: error
          retention-days: 7
