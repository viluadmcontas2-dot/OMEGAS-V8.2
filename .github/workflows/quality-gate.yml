name: OMEGAS V8 Quality Gate

on:
  push:
    branches:
      - main
      - 'rebuild/**'
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'refine/**'
    paths-ignore:
      - '.ci-results/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Governança, contratos e cenários rápidos
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      android_required: ${{ steps.scope.outputs.android_required }}
      apk_allowed: ${{ steps.scope.outputs.apk_allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Classificar impacto Android e fronteira de APK
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # APK é fronteira externa separada. workflow_dispatch continua sendo o
          # caminho normal. A exceção abaixo vale somente para branch isolada
          # rebuild/apk-authorized-* criada após autorização explícita do proprietário,
          # porque o conector disponível nesta conversa não expõe workflow_dispatch.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || { [ "$EVENT_NAME" = "push" ] && [[ "$REF_NAME" == rebuild/apk-authorized-* ]]; }; then
            echo "apk_allowed=true" >> "$GITHUB_OUTPUT"
            echo "android_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "apk_allowed=false" >> "$GITHUB_OUTPUT"
          fi

          # Branches de reconstrução/expansão/refino validam a fotografia acumulada
          # contra main; um último commit documental não pode esconder Kotlin/UI.
          if [ "$EVENT_NAME" = "push" ] && { [[ "$REF_NAME" == refactor/* ]] || [[ "$REF_NAME" == feature/* ]] || [[ "$REF_NAME" == fix/* ]] || [[ "$REF_NAME" == refine/* ]]; }; then
            git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
            files="$(git diff --name-only origin/main "$GITHUB_SHA")"
          else
            BASE="$BEFORE_SHA"
            if [ "$EVENT_NAME" = "pull_request" ]; then BASE="$PR_BASE_SHA"; fi
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              echo "android_required=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            files="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          fi

          if printf '%s\n' "$files" | grep -Eq '^(app/|gradle/|gradlew|gradlew\.bat|build\.gradle\.kts|settings\.gradle\.kts|config/omegas-release\.json|\.github/workflows/)'; then
            echo "android_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "android_required=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Governança executável
        run: python -B tests/test_governance_contract.py
      - name: Contratos e testes de interface
        run: python -B tools/run_checks.py
      - name: Sintaxe JavaScript da UI ativa
        shell: bash
        run: |
          set -euo pipefail
          find app/src/main/assets/ui -name '*.js' -print0 | xargs -0 -n1 node --check

  android-gate:
    name: Cenários Kotlin e lint Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: fast-gate
    if: needs.fast-gate.outputs.android_required == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validar Gradle Wrapper conhecido
        shell: bash
        run: |
          set -euo pipefail
          echo 'c08ce416101cb71e50ff38f29a1504ac40cb4f6c351c307d57df992f26920343  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          grep -Fx 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -Fx 'validateDistributionUrl=true' gradle/wrapper/gradle-wrapper.properties
      - name: Preparar Gradle
        run: chmod +x gradlew
      - name: Testes Kotlin/JVM e matriz de consequências
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest
      - name: Android Lint
        run: ./gradlew --no-daemon --stacktrace lintDebug
      - name: Gerar APK debug somente quando autorizado
        if: needs.fast-gate.outputs.apk_allowed == 'true'
        env:
          OMEGAS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Gerar checksums do APK
        if: needs.fast-gate.outputs.apk_allowed == 'true'
        run: |
          mkdir -p build/quality-artifacts
          find app/build/outputs/apk/debug -name '*.apk' -print0 | xargs -0 sha256sum | tee build/quality-artifacts/APK_SHA256.txt
          cp app/build/outputs/apk/debug/*.apk build/quality-artifacts/
      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
            build/reports/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
      - name: Publicar APK de teste
        if: needs.fast-gate.outputs.apk_allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: omegas-v8-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/quality-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  evidence:
    name: Registrar evidência do gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - fast-gate
      - android-gate
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Baixar APK e checksum confirmados
        if: needs.android-gate.result == 'success' && needs.fast-gate.outputs.apk_allowed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: omegas-v8-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/gate-evidence
      - name: Registrar resultado exato
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          FAST_RESULT: ${{ needs.fast-gate.result }}
          ANDROID_RESULT: ${{ needs.android-gate.result }}
          APK_ALLOWED: ${{ needs.fast-gate.outputs.apk_allowed }}
          ARTIFACT_NAME: omegas-v8-debug-${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .ci-results
          APK_SHA=""
          APK_FILE=""
          if [ -f build/gate-evidence/APK_SHA256.txt ]; then
            APK_SHA="$(awk 'NR==1 {print $1}' build/gate-evidence/APK_SHA256.txt)"
            APK_FILE="$(awk 'NR==1 {print $2}' build/gate-evidence/APK_SHA256.txt)"
          fi
          RESULT="FAIL"
          if [ "$FAST_RESULT" = "success" ] && { [ "$ANDROID_RESULT" = "success" ] || [ "$ANDROID_RESULT" = "skipped" ]; }; then RESULT="PASS"; fi
          APK_ARTIFACT="$ARTIFACT_NAME"
          if [ "$APK_ALLOWED" != "true" ]; then APK_ARTIFACT="not-authorized"; fi
          cat > .ci-results/final-quality-gate.md <<EOF
          # OMEGAS V8 — Final Quality Gate

          - Result: **$RESULT**
          - Tested commit: \`$TESTED_SHA\`
          - Workflow run id: \`$RUN_ID\`
          - Fast gate: **$FAST_RESULT**
          - Android gate: **$ANDROID_RESULT**
          - APK authorized: **$APK_ALLOWED**
          - APK artifact: \`$APK_ARTIFACT\`
          - APK file: \`${APK_FILE:-not-generated}\`
          - APK SHA-256: \`${APK_SHA:-not-generated}\`
          - Release/publication: **no**
          - Main changed: **no**
          EOF
      - name: Persistir evidência na branch de trabalho
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-results/final-quality-gate.md
          git commit -m "ci(result): registrar quality gate ${GITHUB_SHA::7}" || exit 0
          git push
