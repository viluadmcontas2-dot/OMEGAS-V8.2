# APK somente por solicitação manual autorizada.
name: OMEGAS APK (aprovação do dono)

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Gerar APK somente após autorização explícita do proprietário'
        required: true
        default: false
        type: boolean
permissions:
  contents: read

env:
  PRODUCT_SHA: ${{ github.sha }}

concurrency:
  group: omegas-apk-gated-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-build-publish:
    if: ${{ inputs.build_apk == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}

      - name: Prove checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          echo "SOURCE_SHA=$(git rev-parse HEAD)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache do Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1
      - name: Instalar navegador dos testes
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "${{ runner.temp }}/omegas-ui-test" playwright@1.56.1
          "${{ runner.temp }}/omegas-ui-test/node_modules/.bin/playwright" install chromium

      - name: Run contracts, unit tests, lint and assemble
        shell: bash
        env:
          OMEGAS_SOURCE_SHA: ${{ env.PRODUCT_SHA }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          export NODE_PATH="${{ runner.temp }}/omegas-ui-test/node_modules"
          python3 -B tools/run_checks.py --full 2>&1 | tee "${{ runner.temp }}/apk-contracts.log"
          ./gradlew lintDebug assembleDebug \
            -PomegasAbis=arm64-v8a \
            --no-daemon \
            --stacktrace 2>&1 | tee "${{ runner.temp }}/apk-gradle.log"

      - name: Verify and hash APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          VERSION="$(python3 -c 'import json; print(json.load(open("config/omegas-release.json"))["versionName"])')"
          mkdir -p build/apk
          cp "$APK" "build/apk/OMEGAS-${VERSION}-${PRODUCT_SHA:0:12}.apk"
          mkdir -p build/evidence
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          APK_BYTES="$(stat -c %s "$APK")"
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          unzip -t "$APK" >/dev/null

          BUILD_CONFIG="$(find app/build/generated -type f -name 'BuildConfig.java' -path '*debug*' -print -quit || true)"
          BUILD_COMMIT=""
          if [ -n "$BUILD_CONFIG" ] && [ -f "$BUILD_CONFIG" ]; then
            BUILD_COMMIT="$(sed -n 's/.*OMEGAS_BUILD_COMMIT = "\([^"]*\)".*/\1/p' "$BUILD_CONFIG" | head -n1)"
          fi

          {
            echo "OMEGAS_APK=PASS"
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "SOURCE_TREE=$SOURCE_TREE"
            echo "OMEGAS_BUILD_COMMIT=$BUILD_COMMIT"
            echo "EXPECTED_BUILD_COMMIT=${PRODUCT_SHA:0:12}"
            echo "APK_PATH=$APK"
            echo "APK_SHA256=$APK_SHA256"
            echo "APK_BYTES=$APK_BYTES"
            echo "APK_ZIP_INTEGRITY=PASS"
            echo "PHYSICAL_INSTALL_NOT_YET_CLAIMED=true"
          } | tee build/evidence/omegas-apk-evidence.txt

          test "$SOURCE_SHA" = "$PRODUCT_SHA"
          if [ -n "$BUILD_COMMIT" ]; then
            test "$BUILD_COMMIT" = "${PRODUCT_SHA:0:12}"
          fi

      - name: Publish APK + evidence
        uses: actions/upload-artifact@v4
        with:
          name: omegas-apk-${{ env.PRODUCT_SHA }}
          path: |
            build/apk/OMEGAS-*.apk
            build/evidence/omegas-apk-evidence.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apk-*.log
            app/build/reports/
            app/build/test-results/
            build/reports/
          if-no-files-found: warn
          retention-days: 14
