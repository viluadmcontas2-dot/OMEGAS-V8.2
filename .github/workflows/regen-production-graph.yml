name: OMEGAS temporary production graph regeneration

on:
  push:
    branches:
      - claude/aura-diario-store-safety

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Graphify code graph
        run: |
          python -m pip install --quiet graphifyy
          graphify update . 2>&1 | tail -5
      - name: Regenerate deterministic production graph
        run: python3 -B tools/grafo_producao.py
      - name: Commit generated production graph without force push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/grafo/producao.json docs/grafo/PRODUCAO.md
          if git diff --cached --quiet; then
            echo "Production graph already current"
            exit 0
          fi
          git commit -m "docs(grafo): regenerar grafo de produção"
          git push origin "HEAD:${BRANCH}"
      - uses: actions/upload-artifact@v4
        with:
          name: production-graph-generated
          path: |
            docs/grafo/producao.json
            docs/grafo/PRODUCAO.md
          retention-days: 7
