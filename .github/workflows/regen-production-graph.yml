name: OMEGAS temporary production graph regeneration

on:
  push:
    branches:
      - claude/aura-diario-store-safety

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Graphify code graph
        run: |
          python -m pip install --quiet graphifyy
          graphify update . 2>&1 | tail -5
      - name: Regenerate deterministic production graph
        run: python3 -B tools/grafo_producao.py
      - uses: actions/upload-artifact@v4
        with:
          name: production-graph-generated
          path: |
            docs/grafo/producao.json
            docs/grafo/PRODUCAO.md
          retention-days: 7
