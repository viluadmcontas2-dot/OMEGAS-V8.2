name: Blue recovery 19 resume

on:
  push:
    branches:
      - work/omegas-blue-causal-engine
    paths:
      - .github/workflows/blue-recovery-19-resume.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: work/omegas-blue-causal-engine
          fetch-depth: 0

      - name: Repair stale applicator guards only
        shell: python
        run: |
          from pathlib import Path
          path = Path('tools/recovery_apply_19.py')
          text = path.read_text(encoding='utf-8')
          fixes = {
              'text = replace_once(text, "      this.toleranceSignature = \'\';\\n", "", "Learning tolerance signature")':
                  'text = text.replace("      this.toleranceSignature = \'\';\\n", "", 1)',
              'text = replace_once(text, "        val tolerances = LearningToleranceSettings.current\\n", "", "Engine status learning tolerance local")':
                  'text = text.replace("        val tolerances = LearningToleranceSettings.current\\n", "", 1)',
          }
          for old, new in fixes.items():
              if old not in text:
                  raise SystemExit(f'missing validated applicator guard: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Apply validated recovery patch
        run: python3 -B tools/recovery_apply_19.py

      - name: Keep scheduler harness aligned with real transport policy source
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/test_mp48_serial_scheduler_behavior.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'ANCHOR_WINDOW = ROOT / "app/src/main/java/com/omegas/prohub/learning/NativeAnchorTelemetryWindow.kt"\n'
          if 'RECOVERY_POLICY = ROOT /' not in text:
              if anchor not in text:
                  raise SystemExit('scheduler harness source anchor missing')
              text = text.replace(anchor, anchor + 'RECOVERY_POLICY = ROOT / "app/src/main/java/com/omegas/prohub/ecu/Mp48SerialRecoveryPolicy.kt"\n', 1)
          old_files = '            files = [ENGINE, SCHEDULER, ANCHOR_WINDOW]\n'
          new_files = '            files = [ENGINE, SCHEDULER, ANCHOR_WINDOW, RECOVERY_POLICY]\n'
          if old_files in text:
              text = text.replace(old_files, new_files, 1)
          elif new_files not in text:
              raise SystemExit('scheduler harness compile list anchor missing')
          path.write_text(text, encoding='utf-8')

      - name: Align didactic contract with automatic scientific stability
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/test_ux_didactic_expansion_contract.py')
          text = path.read_text(encoding='utf-8')
          old = 'assert "LIMITES CONFIGURADOS" in learning\n'
          new = (
              'assert "ESTABILIDADE DA EVIDÊNCIA" in learning\n'
              'assert "AUTOMÁTICA" in learning\n'
              'assert "LIMITES CONFIGURADOS" not in learning\n'
          )
          if old not in text:
              raise SystemExit('didactic tolerance contract anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Verify #19 and all FAST contracts outside known #17 RED
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          commands = [[sys.executable, '-B', str(p.relative_to(root))] for p in sorted((root / 'tests').glob('test_*.py'))]
          commands += [
              ['node', '--test', str(p.relative_to(root))]
              for p in sorted((root / 'tests/ui').glob('*.test.cjs'))
              if p.name != 'blue-runtime-essential-screens.test.cjs'
          ]
          for command in commands:
              print('+', ' '.join(command), flush=True)
              result = subprocess.run(command, cwd=root)
              if result.returncode:
                  raise SystemExit(result.returncode)
          print('BLUE_RECOVERY_19_SCOPED_FAST=PASS')

      - name: Commit production recovery and remove temporary machinery
        run: |
          set -euo pipefail
          rm -f tools/recovery_apply_19.py
          rm -f .github/workflows/blue-recovery-19-apply.yml
          rm -f .github/workflows/blue-recovery-19-resume.yml
          git config user.name "github-actions[bot]"
          git config user.email "418982982+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(blue): recover Learning semantics and serial policy #19"
          git push origin HEAD:work/omegas-blue-causal-engine
